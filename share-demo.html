<!DOCTYPE html>
<html lang="zh-CN" data-shell="light" data-font="misans" data-type-scale="standard" data-type-scale-factor="1"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="text-scale" content="scale">
<meta name="description" content="用于检查静态标签与首图，不代表微信真机结果。">
<title>B04 分享元信息样例</title>
<meta data-handbook-share="B04" property="og:type" content="website"><meta data-handbook-share="B04" property="og:title" content="网页资料中心 · 分享样例"><meta data-handbook-share="B04" property="og:description" content="B04 基础分享元信息，实际客户端效果需真机确认。"><meta data-handbook-share="B04" property="og:url" content="https://arjuntam.github.io/handbook-workshop/share-demo.html"><meta data-handbook-share="B04" property="og:image" content="https://arjuntam.github.io/handbook-workshop/assets/share-cover.png"><meta data-handbook-share="B04" property="og:image:alt" content="网页资料中心 · 分享样例"><meta data-handbook-share="B04" property="og:image:width" content="1200"><meta data-handbook-share="B04" property="og:image:height" content="630"><meta data-handbook-share="B04" name="twitter:card" content="summary_large_image"><meta data-handbook-share="B04" name="twitter:image" content="https://arjuntam.github.io/handbook-workshop/assets/share-cover.png"><link data-handbook-share="B04" rel="image_src" href="https://arjuntam.github.io/handbook-workshop/assets/share-cover.png"><style>
:root{
  --brand:#0d3b66; --brand2:#1b5c96; --accent:#2b7fd4; --accent-soft:#e8f1fb;
  --bg:#f4f6f9; --surface:#fff; --text:#1b2733; --muted:#63748a; --border:#e2e8f0;
  --green:#1f8a5b; --green-soft:#e8f6ef; --red:#c0392b; --red-soft:#fdecea;
  --amber:#9a6b12; --amber-soft:#fdf3e0; --radius:14px; --shadow:0 2px 14px rgba(16,42,71,.07);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;height:60px;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.04em;color:var(--brand);white-space:nowrap}
.brand-mark{width:26px;height:26px;background:var(--brand);color:#fff;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900}
.brand-logo{height:26px;width:auto;display:block}
.brand-text{font-size:16px;font-weight:800;color:var(--brand);white-space:nowrap}
.topbar-title{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-sp{flex:1}
.home-btn{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:1px solid var(--border);
  background:#fff;color:var(--brand2);border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.home-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.home-btn svg{width:17px;height:17px}
.search-box{position:relative;flex:none}
.search-box input{width:210px;height:36px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:0 12px 0 34px;font-size:13px;outline:none;transition:border .15s,box-shadow .15s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 键盘焦点统一可见（鼠标点击不显示） */
:where(a,button,summary,input,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.section:focus{outline:none}
.search-box svg{position:absolute;left:10px;top:9px;width:17px;height:17px;color:var(--muted)}
.menu-btn{display:none;width:38px;height:38px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:18px;cursor:pointer}
/* 布局 */
.layout{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:248px minmax(0,1fr);gap:32px;padding:28px 24px 96px}
.sidebar{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding-right:6px}
.side-hint{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:4px 10px 12px;font-weight:700}
.nav-group{margin-bottom:2px;border-bottom:1px solid #edf1f6;padding-bottom:6px}
.nav-group summary{list-style:none;cursor:pointer;user-select:none}
.nav-group summary::-webkit-details-marker{display:none}
.nav-group-title{display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:800;color:var(--brand);padding:10px 10px;letter-spacing:.01em;border-radius:7px}
.nav-group-title:hover{background:#eef3f9;color:var(--brand)}
.nav-group-title::after{content:"▾";font-size:11px;transition:transform .18s;color:#9fb0c4}
.nav-group[open] .nav-group-title::after{transform:rotate(180deg)}
.nav-group-links{padding:2px 0}
.nav-link{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 14px;border-radius:8px;color:#5c7189;text-decoration:none;font-size:13px;line-height:1.4;margin:1px 0;transition:background .12s,color .12s}
.nav-link:hover{background:#eef3f9;color:var(--brand)}
.nav-link.target-current{background:var(--accent-soft);color:var(--brand2);font-weight:700}
.nav-link .nav-dot{width:5px;height:5px;border-radius:50%;background:#b9c6d6;flex:none}
.nav-link.target-current .nav-dot{background:var(--accent)}
main{min-width:0}
/* 章节：一次显示一节（翻页模式） */
.section{scroll-margin-top:84px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:38px 44px;margin-bottom:14px;display:none}
.section.active{display:block}
.section .section-head:first-child{margin-top:0}
/* 翻页导航 */
.pagerbar{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;
  background:#f7fafd;
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
.pagerbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:20px;
  background:linear-gradient(180deg,rgba(247,250,254,0),#f7fafd);pointer-events:none}
.pager{pointer-events:auto;max-width:1360px;margin:0 auto;
  padding:var(--sp-1) 24px var(--sp-1) 304px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.pager>#pager-prev{justify-self:start}
.pager>#pager-next{justify-self:end}
.pager-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--brand2);
  border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 2px 8px rgba(16,42,71,.05);transition:background .15s,border-color .15s}
.pager-pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pager-pos b{color:var(--brand2);font-size:15px}
.pager-label{display:block;font-size:11px;color:var(--muted);font-weight:500}
.section-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.sec-kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);
  padding:4px 10px;border-radius:20px;margin-bottom:12px}
.section h2{margin:0 0 8px;font-size:26px;line-height:1.35;color:var(--brand);letter-spacing:-.01em}
.sec-sub{margin:0;color:var(--muted);font-size:15px}
.lede{font-size:16.5px;color:#2b3a4b;background:linear-gradient(90deg,var(--accent-soft),transparent);
  border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 10px 10px 0;margin:0 0 22px}
.body-text{margin:0 0 16px;color:#33445a}
.subhead{font-size:17px;color:var(--brand);margin:26px 0 14px;padding-left:11px;border-left:3px solid var(--accent)}
/* 卡片网格 */
.grid{display:grid;gap:16px;margin:0 0 18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;border:1px solid var(--border);border-radius:12px;padding:20px;background:#fcfdfe;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card-num{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;background:var(--brand);color:#fff;
  font-size:12px;font-weight:800;margin-bottom:10px}
.card-title{font-size:16px;margin:0 0 8px;color:var(--brand2);line-height:1.45;display:flex;align-items:center;gap:9px}
.card-icon{width:22px;height:22px;object-fit:contain;flex:none}
.card-sub{font-size:12px;color:var(--accent);font-weight:700;margin:-3px 0 8px}
.card-body{font-size:14px;color:#455a72;margin:0;line-height:1.7}
.card-img{margin:14px 0 0}
.card-img img{width:100%;border-radius:9px;display:block}
.card-img figcaption{font-size:12px;color:var(--muted);margin-top:7px}
/* 数字统计卡（滚动计数） */
.stat-grid{display:grid;gap:14px;margin:0 0 20px}
.stat-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat-grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat-card{position:relative;border:1px solid var(--border);border-radius:13px;padding:20px 16px;background:linear-gradient(160deg,#fbfdff,#f2f7fc);text-align:center;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.stat-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--brand2));opacity:.85}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfe1f5}
.stat-num{font-size:34px;font-weight:900;line-height:1.1;color:var(--brand);letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;gap:1px}
.stat-num .stat-suffix{font-size:20px;font-weight:800;color:var(--accent)}
.stat-num .stat-prefix{font-size:20px;font-weight:800;color:var(--accent)}
.stat-label{font-size:13px;color:#41546a;margin-top:8px;font-weight:700;line-height:1.4}
.stat-note{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
/* 仅屏幕阅读器可见 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* 进场动画：小节切换时卡片依次上浮（默认静态，仅在允许动效时启用） */
@media(prefers-reduced-motion:no-preference){
  .section.active .anim-item{animation:riseIn .42s cubic-bezier(.22,.68,.36,1) both;animation-delay:var(--d,0ms)}
}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
/* 顶部阅读进度条：只用 transform 合成，不触发布局 */
.read-progress{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--brand2));
  z-index:60;transform:scaleX(var(--p,0));transform-origin:0 50%;transition:transform .18s ease;pointer-events:none;will-change:transform}
@media(prefers-reduced-motion:reduce){.read-progress{transition:none}}
/* 提示卡 */
.callout{border-radius:11px;padding:15px 18px;margin:0 0 18px;border:1px solid}
.callout-label{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 9px;border-radius:6px;margin-bottom:7px}
.callout-body{font-size:14.5px;line-height:1.75}
.callout-blue{background:var(--accent-soft);border-color:#cfe1f5;color:#1c4a7a}
.callout-blue .callout-label{background:var(--accent);color:#fff}
.callout-red{background:var(--red-soft);border-color:#f6cfc9;color:#8d2c20}
.callout-red .callout-label{background:var(--red);color:#fff}
.callout-green{background:var(--green-soft);border-color:#c7e9d7;color:#1c6646}
.callout-green .callout-label{background:var(--green);color:#fff}
.callout-amber{background:var(--amber-soft);border-color:#f0dfb8;color:#7d5710}
.callout-amber .callout-label{background:var(--amber);color:#fff}
/* 对话气泡 */
.chat{background:#f7f9fc;border:1px solid var(--border);border-radius:13px;padding:20px;margin:0 0 18px}
.chat-cap{font-size:13px;color:var(--muted);margin-bottom:16px;text-align:center;font-weight:600}
.bubble-row{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.bubble-row.client{flex-direction:row-reverse}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.12)}
.avatar-ph{display:grid;place-items:center;background:#e6effa;color:#3f7fb8;font-size:14px;font-weight:800;overflow:hidden}
.avatar-ph svg{width:22px;height:22px;fill:currentColor}
.avatar-ph.client{background:#eef2f7;color:#93a7ba}
.bubble{position:relative;max-width:min(78%,620px);background:#fff;border:1px solid #dfe7f0;border-radius:4px 13px 13px 13px;
  padding:12px 42px 12px 15px;font-size:14.5px;line-height:1.72;box-shadow:0 1px 3px rgba(16,42,71,.04)}
.bubble-row.client .bubble{background:#dceafc;border-color:#cddff4;border-radius:13px 4px 13px 13px}
.bubble .copy{position:absolute;top:7px;right:8px}
/* 仿真微信朋友圈 */
.moments{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 24px 16px;margin:0 0 20px;
  box-shadow:0 3px 16px rgba(16,42,71,.06)}
.mm-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mm-avatar{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#2f7fd6,#1b5fa8);flex:none;
  display:grid;place-items:center;overflow:hidden}
.mm-avatar svg{width:30px;height:30px;fill:#fff}
.mm-name{font-size:16px;font-weight:800;color:#1a3a5c;line-height:1.3}
.mm-time{font-size:13px;color:#9aa9bb;margin-left:auto;font-weight:500}
.mm-text{font-size:15px;line-height:1.8;color:#263748;margin:0 0 14px;word-break:break-word}
.mm-photos{display:grid;gap:4px;margin:0 0 14px;max-width:520px}
.mm-photos-1{grid-template-columns:1fr;max-width:340px}
.mm-photos-2{grid-template-columns:repeat(2,1fr);max-width:400px}
.mm-photos-3{grid-template-columns:repeat(3,1fr)}
.mm-photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:5px;background:#eef2f7;display:block;cursor:zoom-in}
.mm-actions{display:flex;gap:20px;border-top:1px solid #eef2f7;padding-top:12px}
.mm-act{width:26px;height:26px;display:grid;place-items:center;color:#aab7c6}
.mm-act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
/* 步骤 */
.steps{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:12px}
.step{display:flex;gap:14px;background:#fcfdfe;border:1px solid var(--border);border-radius:11px;padding:15px 17px}
.step-n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--brand2);font-weight:800;
  font-size:13px;display:grid;place-items:center}
.step-title{font-size:15px;margin:2px 0 4px;color:var(--brand2)}
.step-body{font-size:14px;color:#4a5e75;line-height:1.68}
/* 图片画廊 */
.gallery{display:grid;gap:14px;margin:0 0 18px}
.gallery-2{grid-template-columns:repeat(2,1fr)} .gallery-3{grid-template-columns:repeat(3,1fr)} .gallery-4{grid-template-columns:repeat(4,1fr)}
.gallery-item{margin:0;background:#f7f9fc;border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column}
.gallery-item img{width:100%;object-fit:contain;border-radius:6px;display:block;cursor:zoom-in;background:#fff;transition:opacity .15s}
.gallery-1 .gallery-item img{height:300px} .gallery-2 .gallery-item img{height:210px} .gallery-3 .gallery-item img{height:170px} .gallery-4 .gallery-item img{height:140px}
.gallery-item img:hover{opacity:.9}
.gallery-item figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45;text-align:center;min-height:34px}
figure:not(.gallery-item) img{max-width:100%;height:auto;object-fit:contain;border-radius:10px;display:block;border:1px solid var(--border);cursor:zoom-in}
figure figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}
/* 点击放大 lightbox */
.lightbox{position:fixed;inset:0;z-index:200;border:0;padding:0;background:rgba(8,20,34,.9);align-items:center;justify-content:center}
.lightbox[open]{display:flex}
.lightbox:modal{overscroll-behavior:contain}
.lightbox::backdrop{overflow:hidden;overscroll-behavior:contain}
.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.lightbox-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.15);
  color:#fff;font-size:26px;cursor:pointer;line-height:1;display:grid;place-items:center}
.lightbox-close:hover{background:rgba(255,255,255,.28)}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;
  background:rgba(255,255,255,.14);color:#fff;font-size:34px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:background .15s,transform .15s;backdrop-filter:blur(4px)}
.lb-prev{left:3vw}.lb-next{right:3vw}
.lb-prev:hover,.lb-next:hover{background:rgba(255,255,255,.3);transform:translateY(-50%) scale(1.06)}
.lb-prev[hidden],.lb-next[hidden]{display:none}
.lightbox-cap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:13px;
  background:rgba(0,0,0,.4);padding:6px 16px;border-radius:20px;max-width:80vw;text-align:center}
/* 金句 / 提示 / 分割 */
.quote{margin:0 0 18px;padding:20px 24px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:12px;
  font-size:18px;line-height:1.6;font-weight:600;text-align:center}
/* 点击揭晓金句：大标题 + 闪动按钮引导 */
.quote-reveal{border:1px solid var(--border);border-radius:14px;background:#f8fbff;margin:0 0 18px;overflow:hidden}
.quote-reveal summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 22px;user-select:none;transition:background .15s}
.quote-reveal summary::-webkit-details-marker{display:none}
.quote-reveal summary:hover{background:#eef4fb}
.qr-title{font-size:21px;font-weight:800;color:var(--brand);letter-spacing:.01em}
.qr-btn{display:inline-flex;align-items:center;gap:4px;padding:9px 16px;border-radius:22px;
  background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;flex:none;
  animation:qrPulse 2.1s ease-out infinite}
.qr-btn svg{margin-right:-2px}
.quote-reveal summary:hover .qr-btn{background:var(--brand2)}
.quote-reveal[open] .qr-btn{display:none}
.quote-reveal[open] summary{padding-bottom:14px;border-bottom:1px dashed var(--border)}
.quote-reveal .quote{margin:0;border-radius:0 0 13px 13px}
@keyframes qrPulse{0%{box-shadow:0 0 0 0 rgba(43,127,212,.42)}70%{box-shadow:0 0 0 11px rgba(43,127,212,0)}100%{box-shadow:0 0 0 0 rgba(43,127,212,0)}}
@media (prefers-reduced-motion:reduce){.qr-btn{animation:none}}
@media(max-width:600px){.qr-title{font-size:17px}.quote-reveal summary{padding:14px 16px}.qr-btn{padding:8px 13px;font-size:12.5px}}
.attach-note{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border:1px solid #f0dfb8;color:#7d5710;
  border-radius:10px;padding:12px 16px;font-size:13.5px;margin:0 0 16px}
.attach-ico{font-size:16px;line-height:1.4}
.divider{border:0;border-top:1px dashed var(--border);margin:26px 0}
/* FAQ 折叠 */
.faq-list{display:grid;gap:9px;margin-bottom:16px}
.faq{border:1px solid var(--border);border-radius:10px;background:#fcfdfe;overflow:hidden}
.faq summary{cursor:pointer;padding:13px 16px;font-weight:650;color:var(--brand2);list-style:none;display:flex;align-items:center;gap:9px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"+";width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:800;flex:none}
.faq[open] summary::before{content:"−"}
.faq-inner{padding:0 16px 16px 45px}
.faq-principle{font-size:13.5px;color:#5a6b80;background:#f4f7fb;border-radius:8px;padding:10px 13px;margin-bottom:12px}
.faq-principle b{color:var(--brand2);margin-right:8px}
.faq-answer{position:relative;font-size:14px;line-height:1.75;background:#eef4fb;border:1px solid #dbe8f6;border-radius:9px;padding:13px 46px 13px 14px}
/* 话术库 */
.scriptlib{display:grid;gap:9px}
.sl-group{border:1px solid var(--border);border-radius:10px;background:#fcfdfe;overflow:hidden}
.sl-flat-h{display:flex;align-items:center;padding:13px 16px;font-size:13.5px;font-weight:800;color:var(--brand);
  background:linear-gradient(180deg,#f6fafd,#fcfdfe)}
.sl-flat .sl-body{padding-top:12px}
.sl-group summary{cursor:pointer;padding:12px 16px;font-weight:700;color:var(--brand2);list-style:none;display:flex;justify-content:space-between;align-items:center}
.sl-group summary::-webkit-details-marker{display:none}
.sl-group summary::after{content:"展开";font-size:11px;color:var(--muted);font-weight:600}
.sl-group[open] summary::after{content:"收起"}
.sl-count{font-size:11px;color:var(--muted);font-weight:500;margin-left:auto;margin-right:10px}
.sl-body{padding:4px 16px 16px;border-top:1px solid var(--border)}
.sl-h{font-size:14px;font-weight:800;color:var(--brand);margin:16px 0 8px;padding-left:10px;border-left:3px solid var(--accent)}
.sl-p{font-size:13.5px;color:#4a5e75;margin:6px 0;line-height:1.7}
.sl-line{position:relative;font-size:14px;line-height:1.72;background:#f4f8fc;border-radius:8px;padding:10px 46px 10px 13px;margin:6px 0;color:#2f4056}
.sl-who{display:inline-block;font-size:11px;font-weight:800;color:var(--accent);margin-right:9px;background:var(--accent-soft);padding:1px 7px;border-radius:5px}
/* 复制按钮（copy-button 指南） */
.copy-wrap{position:relative;margin-top:12px;padding:11px 42px 12px 14px;background:#f6f9fd;
  border-left:3px solid #cfe1f5;border-radius:8px}
.copy-wrap .copy{position:absolute;top:6px;right:6px}
.copy-wrap .copy-text{font-size:14px;line-height:1.8;color:#33475c}
.copy-wrap+.card-body{margin-top:9px!important;font-size:12.5px!important;color:#7b8fa4!important;line-height:1.7}
.copy{position:relative;display:inline-grid;place-items:center}
.copy-button{min-inline-size:26px;min-block-size:26px;width:26px;height:26px;border:1px solid var(--border);background:#fff;color:var(--muted);
  border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:color .15s,background .15s,border .15s}
.copy-button:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.copy-button svg{width:15px;height:15px}
.copy-button[data-copied]{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.copy-button[data-failed]{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.copy-button[data-copied] svg{display:none}
.copy-button[data-copied]::after{content:"✓";font-weight:900;font-size:15px}
.tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#22364a;color:#fff;font-size:11px;
  padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .15s;pointer-events:none}
.copy-button[data-copied] ~ .tip,.copy-button[data-failed] ~ .tip{opacity:1}
.copy-text{white-space:pre-wrap}
/* 下载抽屉 */
.dl-dock{position:fixed;right:20px;bottom:20px;z-index:60;transition:bottom .2s}
body.viewing .dl-dock{bottom:calc(var(--sp-5) + var(--sp-6))}   /* 跟随文字缩放，始终高于底栏 */
.dl-dock>summary{list-style:none;cursor:pointer;background:var(--brand);color:#fff;border-radius:24px;
  height:42px;padding:0 16px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:7px;
  box-shadow:0 6px 18px rgba(13,59,102,.26);transition:background .15s,box-shadow .15s}
.dl-dock>summary:hover{background:var(--brand2);box-shadow:0 8px 22px rgba(13,59,102,.32)}
.dl-dock[open]>summary{background:var(--brand2)}
.dl-dock>summary::-webkit-details-marker{display:none}
.dl-dock-ico{font-size:15px;line-height:1}
.dl-panel{position:absolute;right:0;bottom:calc(100% + 10px);width:310px;background:#fff;border:1px solid var(--border);border-radius:13px;
  box-shadow:0 12px 40px rgba(16,42,71,.18);padding:14px;max-height:70vh;overflow:auto}
.dl-title{font-size:13px;font-weight:800;color:var(--brand);margin-bottom:9px}
.dl-row{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--text);font-size:13px;border:1px solid transparent}
.dl-row:hover{background:#f4f8fc;border-color:var(--border)}
.dl-ico{font-size:15px}.dl-name{flex:1;line-height:1.4}
.dl-go{font-size:11px;color:var(--accent);font-weight:700}
.dl-pending{opacity:.72;cursor:default}
.dl-tag{font-size:10.5px;color:var(--amber);background:var(--amber-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}
.dl-foot{font-size:11px;color:var(--muted);border-top:1px solid var(--border);padding-top:9px;margin-top:6px;line-height:1.5}
/* 封面：独立全屏开场页 */
.cover{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:#dce9f7 url('assets/cover-wave.png') center center/cover no-repeat;padding:32px;overflow:auto}
.cover::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(235,244,252,.5),rgba(16,60,105,.26))}
.cover-inner{position:relative;z-index:1;background:rgba(255,255,255,.95);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.9);border-radius:20px;padding:44px 52px 46px;max-width:720px;width:100%;
  text-align:center;box-shadow:0 24px 70px rgba(10,45,80,.22)}
.cover-logo{height:44px;width:auto;display:block;margin:0 auto 26px}
.cover-brand-text{font-size:20px;font-weight:800;letter-spacing:.08em;color:var(--brand);margin:0 auto 26px}
.cover-kicker{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.18em;color:var(--accent);font-weight:800;margin-bottom:16px}
.cover-kicker::before,.cover-kicker::after{content:"";width:22px;height:2px;background:var(--accent);border-radius:2px;opacity:.6}
.cover h1{font-size:40px;line-height:1.3;margin:0 0 16px;letter-spacing:-.02em;color:var(--brand)}
.cover p{font-size:16px;color:#395679;margin:0 0 20px;line-height:1.75;font-weight:500}
.cover-meta{font-size:12px;color:#8296ad;letter-spacing:.08em;margin-bottom:30px}
.cover-start{display:inline-flex;align-items:center;gap:10px;border:0;cursor:pointer;background:var(--brand);color:#fff;
  font-size:15px;font-weight:700;letter-spacing:.04em;padding:14px 30px;border-radius:30px;
  box-shadow:0 8px 22px rgba(13,59,102,.28);transition:transform .15s,background .15s}
.cover-start:hover{background:var(--brand2);transform:translateY(-2px)}
.cover-start .cs-arrow{font-size:18px;line-height:1}
body.viewing .cover{display:none}
/* 封面态：隐藏正文 UI，只留封面 */
body:not(.viewing) .topbar,body:not(.viewing) .layout,body:not(.viewing) .dl-dock,body:not(.viewing) .read-progress{display:none}
body{overflow-x:hidden}
/* 相关章节交叉引用 */
.xref{margin-top:26px;padding-top:18px;border-top:1px dashed var(--border)}
.xref-hd{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.06em;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.xref-hd::before{content:"↗";color:var(--accent);font-size:14px}
.xref-list{display:flex;flex-wrap:wrap;gap:8px}
.xref-chip{border:1px solid #cfe0f2;background:#f2f7fc;color:var(--brand2);border-radius:20px;padding:7px 14px;
  font-size:13px;font-weight:600;cursor:pointer;transition:background .14s,border .14s}
.xref-chip:hover{background:var(--accent-soft);border-color:var(--accent)}
.xref-chip .xc-arrow{opacity:.55;margin-left:4px}
/* 搜索无结果 */
.no-result{display:none;text-align:center;color:var(--muted);padding:50px 20px}
.no-result.show{display:block}
/* 响应式 */
@media(max-width:960px){
  .layout{grid-template-columns:1fr;gap:16px;padding:18px 14px 90px}
  .pager{padding:var(--sp-1) 14px;gap:8px}
  .pager-btn{padding:8px 12px;font-size:13px}
  .sidebar{position:fixed;top:60px;left:0;bottom:0;width:274px;background:#fff;z-index:45;transform:translateX(-102%);
    transition:transform .22s;box-shadow:6px 0 24px rgba(16,42,71,.12);max-height:none;padding:18px 14px}
  .sidebar.open{transform:none}
  .menu-btn{display:grid;place-items:center}
  .topbar{padding:0 14px;gap:10px}
  .topbar-title{display:none}
  .home-btn span{display:none}
  .home-btn{padding:0 10px}
  .search-box input{width:150px}
  .section{padding:24px 20px}
  .section h2{font-size:22px}
  .cover{padding:18px}
  .cover-inner{padding:30px 24px}
  .cover h1{font-size:29px}
  .grid-3,.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-grid-4,.stat-grid-5{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bubble{max-width:86%}
}
@media(max-width:600px){
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .stat-grid-2,.stat-grid-3,.stat-grid-4,.stat-grid-5{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat-card{padding:16px 12px}
  .stat-num{font-size:24px}
  .gallery-3,.gallery-4{grid-template-columns:repeat(2,1fr)}
  .search-box input{width:118px}
  .topbar .search-box{display:none}
  .brand{font-size:15px}
  .cover h1{font-size:24px}
  .cover-inner{padding:26px 20px}
  .cover-logo{height:36px}
  .faq-inner{padding-left:16px}
}
@media print{
  .sidebar,.topbar,.dl-dock,.copy,.pager,.cover,.xref{display:none!important}
  body:not(.viewing) .layout{display:block!important}
  .layout{display:block;padding:0}
  .section{display:block!important;box-shadow:none;border:none;page-break-inside:avoid}
}
/* 左右对照卡（现状 → 需要） */
.cmp-list{display:grid;gap:12px;margin:0 0 18px}
.cmp-list[style*="repeat(2"] .cmp-body{grid-template-columns:1fr auto 1fr;gap:8px}
.cmp-list[style*="repeat(2"] .cmp-side{padding:9px 10px}
.cmp-list[style*="repeat(2"] .cmp-side p{font-size:12.5px}
.cmp-card{border:1px solid var(--border);border-radius:13px;background:#fff;padding:16px 18px 18px}
.cmp-head{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.cmp-num{width:23px;height:23px;border-radius:7px;background:var(--accent-soft);color:var(--brand2);
  display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.cmp-head h4{margin:0;font-size:15.5px;color:var(--brand);font-weight:800;line-height:1.4}
.cmp-body{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.cmp-side{border-radius:10px;padding:10px 13px 11px;background:#f6f9fd}
.cmp-side p{margin:0;font-size:13.5px;line-height:1.72;color:#42586d}
.cmp-tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;
  padding:2px 7px;border-radius:5px;margin-bottom:6px}
.cmp-now .cmp-tag{background:#e6edf5;color:#5f7488}
.cmp-need{background:#eff6fd}
.cmp-need .cmp-tag{background:#d5e8fa;color:#1a5c96}
.cmp-arrow{align-self:center;color:#c2d2e2;font-size:15px;font-weight:700}
@media(max-width:640px){.cmp-body{grid-template-columns:1fr;gap:8px}.cmp-arrow{display:none}}
/* 单选高亮、Tab、地铁报站、朋友圈互动、移动端拦截（实战沉淀） */
.nav-link.nav-bare{margin:0;padding:10px 10px;font-weight:800;color:var(--brand);font-size:15px;
  letter-spacing:.01em;border-radius:8px}
.nav-link.nav-bare .nav-dot{background:var(--accent)}
.nav-flat{border-bottom:1px solid #edf1f6;padding:1px 0}
.nav-flat:last-child{border-bottom:0}
.pick-grid{margin:0 0 18px}
.pick-card{position:relative;border:1px solid var(--border);border-radius:12px;padding:20px;background:#fcfdfe;
  cursor:pointer;overflow:hidden;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s}
.pick-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:transparent;transition:background .18s}
.pick-card:hover{border-color:var(--accent);box-shadow:0 3px 12px rgba(16,42,71,.09);transform:translateY(-2px)}
.pick-card.on{background:#e8f1fc;border-color:var(--accent);box-shadow:0 6px 18px rgba(43,127,212,.18)}
.pick-card.on::before{background:linear-gradient(180deg,var(--accent),var(--brand))}
.pick-card.on .card-title{color:var(--brand);font-weight:800}
.pick-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabset{border:1px solid var(--border);border-radius:13px;background:var(--surface);padding:16px;margin:0 0 18px}
.tab-heads{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab-head{border:1px solid var(--border);background:#f8fafc;color:#5c6d80;border-radius:20px;padding:8px 14px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
.tab-head.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab-hnum{font-size:11px;opacity:.8}
.tab-panel{display:none}.tab-panel.on{display:block;animation:tabIn .24s ease both}
.tab-panel>.grid{min-height:150px;align-content:start}
.tab-panel>.grid-1 .card{padding:24px 30px;background:linear-gradient(150deg,#fbfdff,#f4f9fe);border-radius:14px;
  display:flex;flex-direction:column;justify-content:center}
.tab-panel>.grid-1 .card>.card-num{align-self:flex-start;margin-bottom:10px}
.tab-panel>.grid-1 .card-title{font-size:19px;margin-bottom:10px}
.tab-panel>.grid-1 .card-sub{font-size:14.5px;font-weight:700;margin-bottom:8px}
.tab-panel>.grid-1 .card-body{max-width:60ch;font-size:14.5px;line-height:1.85;color:#4a6076}
@media(max-width:600px){.tab-panel>.grid-1 .card{padding:18px 18px}.tab-panel>.grid-1 .card-title{font-size:17px}}
.tab-panel .moments{margin-bottom:0}
/* 合计汇总条 */
.tt{display:flex;flex-wrap:wrap;align-items:center;gap:18px 26px;border-radius:13px;padding:14px 20px;
  background:linear-gradient(100deg,#0d3b66,#1b5c96);color:#fff;margin:0 0 18px}
.tt-head{display:flex;align-items:center;gap:10px;flex:none}
.tt-tag{font-size:12px;font-weight:800;letter-spacing:.14em;color:#cfe4f8;border:1px solid rgba(255,255,255,.35);
  border-radius:6px;padding:3px 9px}
.tt-note{font-size:11.5px;color:rgba(255,255,255,.6);font-weight:600}
.tt-body{display:flex;flex-wrap:wrap;gap:12px 34px;flex:1}
.tt-cell{display:flex;align-items:baseline;gap:7px}
.tt-v{font-size:23px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.tt-suf{font-size:13px;font-weight:700;margin-left:1px}
.tt-l{font-size:12px;color:rgba(255,255,255,.72);font-weight:600}
@media(max-width:600px){.tt{padding:12px 14px;gap:12px 18px}.tt-v{font-size:20px}}
/* 分工表：紧凑表格 */
.rt{border:1px solid var(--border);border-radius:13px;background:var(--surface);overflow:hidden;margin:0 0 18px}
.rt-cap{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 16px 10px;
  background:linear-gradient(180deg,#f7fbff,#fff);border-bottom:1px solid var(--border)}
.rt-cap b{font-size:14.5px;font-weight:800;color:var(--brand)}
.rt-cap span{font-size:11.5px;color:var(--muted);font-weight:600}
.rt-scroll{overflow-x:auto}
.rt table{width:100%;border-collapse:collapse;font-size:13px}
.rt thead th{padding:8px 12px;text-align:left;font-size:11px;font-weight:800;letter-spacing:.07em;
  color:#8fa2b6;background:#f6f9fc;border-bottom:1px solid var(--border);white-space:nowrap}
.rt tbody td{padding:9px 12px;border-bottom:1px solid #eef3f8;color:#42586d;line-height:1.5}
.rt tbody tr:last-child td{border-bottom:0}
.rt tbody tr:hover td{background:#fafdff}
.rt-n{width:42px;font-weight:800;color:#a6b6c7;font-variant-numeric:tabular-nums}
.rt-name{font-weight:700;color:var(--brand);min-width:180px}
.rt-note{display:inline;font-weight:500;font-size:11.5px;color:#9aa9bb;margin-left:7px}
.rt-who,.rt-own{white-space:nowrap}
.rt-time{white-space:nowrap;font-variant-numeric:tabular-nums;color:#5c7189}
.rt-row.hi td{background:#fffaf1}
.rt-row.hi .rt-n{color:#d08a2a}
.rt-row.hi .rt-name{color:#9a5c12}
@media(max-width:700px){.rt table{font-size:12.5px}.rt tbody td,.rt thead th{padding:8px 9px}}
/* 流程单：一张卡里的紧凑时间轴 */
.rs{border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden;margin:0 0 18px}
.rs-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:13px 18px 11px;background:linear-gradient(180deg,#f7fbff,#fff);border-bottom:1px solid var(--border)}
.rs-head b{font-size:15.5px;font-weight:800;color:var(--brand);letter-spacing:.01em}
.rs-head span{font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.rs-list{margin:0;padding:8px 18px 12px;list-style:none}
.rs-row{display:grid;grid-template-columns:54px 20px 1fr;align-items:center;
  padding:4px 8px 4px 0;border-radius:8px}
.rs-row.hi{background:#fffaf1;box-shadow:inset 0 0 0 1px #f6e2c4;margin:1px 0}
.rs-t{font-size:13px;font-weight:800;color:var(--brand2);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.rs-rail{position:relative;display:grid;place-items:center;align-self:stretch}
.rs-rail::before{content:"";position:absolute;left:50%;top:-5px;bottom:-5px;width:2px;
  background:#e4ecf5;transform:translateX(-50%)}
.rs-first .rs-rail::before{top:50%}
.rs-last .rs-rail::before{bottom:50%}
.rs-rail i{position:relative;width:8px;height:8px;border-radius:50%;background:#c3d6e9;
  box-shadow:0 0 0 3px var(--surface);display:block}
.rs-row.hi .rs-rail i{background:#e8942c;box-shadow:0 0 0 3px #fffaf1}
.rs-n{font-size:13.5px;color:#42586d;line-height:1.45;padding-left:6px}
.rs-row.hi .rs-n{color:#9a5c12;font-weight:800}
.rs-tag{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.04em;color:#b4690e;
  background:#fdeccd;border-radius:5px;padding:2px 7px;margin-left:10px;white-space:nowrap}
.rs-sep{display:flex;align-items:center;gap:9px;margin:9px 0 3px;font-size:11px;
  font-weight:800;letter-spacing:.08em;color:#9fb0c2}
.rs-sep::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#e6eef7 60%,transparent)}
@media(max-width:600px){.rs-list{padding:6px 12px 10px}.rs-row{grid-template-columns:46px 18px 1fr}.rs-n{font-size:13px}}
.metro{border:1px solid var(--border);border-radius:13px;background:var(--surface);padding:20px 22px 18px;margin:0 0 18px}
.metro.metro-nav{padding:14px 18px 10px;margin:0 0 16px;background:linear-gradient(180deg,#f8fbff,#fff)}
.metro.metro-nav .metro-detail{display:none}
.metro-board{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.metro-now,.metro-next{font-size:12.5px;font-weight:700;border-radius:20px;padding:6px 13px;white-space:nowrap}
.metro-now{background:var(--accent-soft);color:var(--brand2)}.metro-now b{color:var(--brand)}
.metro-next{background:#f4f6f9;color:#7a8a9d}
.metro-track{position:relative;display:grid;grid-template-columns:repeat(var(--metro-n,4),minmax(0,1fr));padding-bottom:6px;margin-bottom:14px}

.hw-cover-letter{position:absolute;inset-block-start:.25rem;inset-inline-end:1.25rem;font-size:7rem;line-height:1;font-weight:var(--weight-title,700);color:var(--accent);opacity:.09;pointer-events:none;user-select:none;z-index:-1}
.hw-cover-kicker{font-size:var(--fs-note);color:var(--accent);font-weight:var(--weight-title,500);letter-spacing:.1em;margin:0 0 1rem}
.hw-cover-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.875rem;min-inline-size:0}
.hw-cover-card{display:flex;gap:.875rem;align-items:start;border:1px solid var(--border);border-radius:var(--r-ctl);padding:1rem;background:var(--surface);color:var(--text);text-align:start;font:inherit;cursor:pointer;min-inline-size:0}
.hw-cover-card>span:last-child{min-inline-size:0}.hw-cover-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}

.hw-cover-title{display:block;font-size:var(--fs-cardtitle);font-weight:var(--weight-title,500);line-height:1.5;overflow-wrap:anywhere}

.hw-cover-action{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-block-start:1.25rem}
.hw-cover-action p{margin:0;font-size:var(--fs-note);line-height:1.7;color:var(--muted);flex:1 1 15rem}
.hw-cover-action button{font:inherit;font-size:var(--fs-note);font-weight:var(--weight-title,500);border:0;border-radius:var(--r-ctl);background:var(--brand);color:var(--surface);padding:.75rem 1rem;min-block-size:2.75rem;cursor:pointer}
@container hw-cover (inline-size < 32rem){.hw-cover-grid{grid-template-columns:1fr}}
.hw-back-link{margin-block-start:1.75rem;padding-block-start:1rem;border-block-start:1px dashed var(--border)}
.hw-back-link .xref-chip{gap:.5rem}
.hw-cover-card:focus-visible,.hw-cover-action button:focus-visible,.hw-section-jump button:focus-visible,.hw-anchor:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.hw-audio{container:hw-audio/inline-size;min-inline-size:0;padding:1rem 1.25rem;margin-block:1rem;border:1px solid var(--border);border-radius:var(--r-card);background:var(--surface);color:var(--text)}
.hw-audio-head{display:flex;align-items:center;flex-wrap:wrap;gap:.625rem;margin-block-end:.75rem}
.hw-audio-badge{font-size:var(--fs-note);padding:.25rem .625rem;border-radius:999px;background:var(--accent-soft);color:var(--brand)}
.hw-audio-title{font-size:var(--fs-text);font-weight:var(--weight-title,500);overflow-wrap:anywhere}.hw-audio-note{font-size:var(--fs-note);line-height:1.7;color:var(--muted);margin-inline-start:auto}
.hw-audio[data-state=empty] .hw-audio-note,.hw-audio[data-state=error] .hw-audio-note{font-weight:var(--weight-title,500);text-decoration:underline}
.hw-audio-picker{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;font-size:var(--fs-note);margin-block:.75rem}.hw-audio-picker select{font:inherit;max-inline-size:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:.5rem;border-radius:.5rem}
.hw-audio-bar{display:grid;grid-template-columns:auto minmax(4rem,1fr) auto auto;align-items:center;gap:.875rem;min-inline-size:0}
.hw-audio-bar[hidden],.hw-audio-picker[hidden]{display:none!important}
.hw-audio-play{inline-size:2.75rem;block-size:2.75rem;border:0;border-radius:50%;background:var(--brand);color:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.hw-audio-play svg{inline-size:1.125rem;block-size:1.125rem;fill:currentColor}.hw-audio-pause-icon,.hw-audio-play.is-playing .hw-audio-play-icon{display:none}.hw-audio-play.is-playing .hw-audio-pause-icon{display:block}
.hw-audio-seek{appearance:none;-webkit-appearance:none;inline-size:100%;min-inline-size:0;block-size:.5rem;border-radius:999px;background:linear-gradient(to right,var(--brand) var(--p,0%),var(--border) var(--p,0%));cursor:pointer;margin:0}
.hw-audio-seek::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;inline-size:1rem;block-size:1rem;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.hw-audio-seek::-moz-range-thumb{inline-size:1rem;block-size:1rem;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.hw-audio-time{font-size:var(--fs-note);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
.hw-audio-rate{font:inherit;font-size:var(--fs-note);padding:.5rem .625rem;border:1px solid var(--border);border-radius:.5rem;color:var(--text);background:var(--surface);cursor:pointer;min-block-size:2.75rem}
.hw-audio :disabled{opacity:.45;cursor:not-allowed}.hw-audio :is(button,input,select):focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.hw-audio.is-enhanced audio{display:none}.hw-audio audio{max-inline-size:100%}.hw-audio-transcript{font-size:var(--fs-note);line-height:1.75;color:var(--muted);margin:.875rem 0 0}.hw-audio-transcript:empty{display:none}
@container hw-audio (inline-size < 30rem){.hw-audio-bar{grid-template-columns:auto minmax(4rem,1fr) auto}.hw-audio-time{grid-column:2;grid-row:2}.hw-audio-rate{grid-column:3;grid-row:1 / 3}.hw-audio-note{margin-inline-start:0}}
@media(forced-colors:active){.hw-audio-seek{appearance:auto;-webkit-appearance:auto}.hw-cover-card{border-color:ButtonText}}

.hw-section-jump{display:flex;align-items:center;gap:.75rem;padding:.5rem .75rem;border:1px solid var(--border);border-radius:var(--r-ctl);background:var(--surface);margin-block:1rem;min-inline-size:0}
.hw-section-jump.is-primary{position:sticky;top:var(--hw-section-top,60px);z-index:30}
.hw-section-jump.is-stuck{box-shadow:0 4px 12px #0000000d}
.hw-section-jump>span{flex:none;color:var(--muted);font-size:var(--fs-note);font-weight:var(--weight-title,500);white-space:nowrap}
.hw-section-jump-links{display:flex;align-items:center;gap:.375rem;min-inline-size:0;overflow-x:auto;overscroll-behavior-inline:contain;scrollbar-width:thin;padding:6px}
.hw-section-jump button{flex:none;white-space:nowrap;font:inherit;font-size:var(--fs-note);line-height:1.5;padding:.375rem .75rem;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--text);cursor:pointer;min-block-size:2.75rem}
.hw-section-jump button:hover{background:var(--accent-soft)}
.hw-section-jump button[aria-current=location]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:var(--weight-title,600)}
.hw-anchor{scroll-margin-block-start:var(--hw-anchor-offset,8rem);scroll-margin-block-end:8rem}
@media print{.hw-section-jump.is-primary{position:static;box-shadow:none}.hw-section-jump-links{flex-wrap:wrap;overflow:visible}}

/* ── 令牌：字号用 rem，跟随系统/浏览器文字缩放；间距取 8 的倍数 ── */
:root{
  --fs-title:1.75rem;--fs-h3:1.3125rem;--fs-cardtitle:1.1875rem;
  --fs-lede:1.125rem;--fs-body:1.0625rem;--fs-text:1rem;
  --fs-note:.8125rem;--fs-tag:.6875rem;
  --sp-1:.5rem;--sp-2:.75rem;--sp-3:1rem;--sp-4:1.5rem;--sp-5:2rem;--sp-6:2.5rem;
  --r-ctl:.75rem;--r-card:1rem;
  --dur-fast:120ms;--dur:250ms;--ease:cubic-bezier(.2,0,0,1);
  --radius:1rem;
  --shadow:0 1px 2px rgba(16,42,71,.05),0 8px 24px rgba(16,42,71,.05);
  --shadow-lift:0 1px 2px rgba(16,42,71,.06),0 12px 32px rgba(16,42,71,.08);
}
html{-webkit-text-size-adjust:100%}
body{font-size:var(--fs-body);line-height:1.65}

/* ── 排版层级：字号与字重成对使用，标题靠字重和留白分层，不靠颜色堆 ── */
.section{padding:var(--sp-6) var(--sp-6);border-radius:var(--r-card)}
.section-head{margin-bottom:var(--sp-5);padding-bottom:var(--sp-3)}
.section h2{font-size:var(--fs-title);line-height:1.3;letter-spacing:-.012em;margin:0 0 var(--sp-1)}
.sec-sub{font-size:var(--fs-text);line-height:1.6;margin-top:var(--sp-1)}
.sec-kicker{font-size:var(--fs-tag);letter-spacing:.1em;border-radius:999px;padding:.25rem .625rem;margin-bottom:var(--sp-2)}
.lede{font-size:var(--fs-lede);line-height:1.6;padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);
  border-radius:0 var(--r-ctl) var(--r-ctl) 0;border-left-width:4px}
.body-text{font-size:var(--fs-body);line-height:1.75;margin-bottom:var(--sp-3)}
.subhead{font-size:var(--fs-h3);line-height:1.4;margin:var(--sp-5) 0 var(--sp-3)}

/* ── 卡片：一档圆角、一档阴影，hover 只上浮 1px 配柔和投影 ── */
.grid{gap:var(--sp-3);margin-bottom:var(--sp-4)}
.card,.pick-card{padding:var(--sp-4);border-radius:var(--r-card);background:#fff;
  transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.card:hover,.pick-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift);border-color:#d9e4f0}
.card-title{font-size:var(--fs-cardtitle);line-height:1.35;margin-bottom:var(--sp-1)}
.card-sub{font-size:var(--fs-note);margin:-.25rem 0 var(--sp-1)}
.card-body{font-size:var(--fs-text);line-height:1.6;color:#3f5468}
.card-num{border-radius:.5rem;font-size:var(--fs-tag)}
.card-img{margin-top:var(--sp-3)}
.card-img img{border-radius:var(--r-ctl)}

/* ── 强调与引用 ── */
.callout{border-radius:var(--r-card);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.callout-body{font-size:var(--fs-body);line-height:1.65}
.callout-label{font-size:var(--fs-tag);border-radius:999px;padding:.1875rem .625rem;margin-bottom:var(--sp-1)}
.quote{font-size:1.375rem;line-height:1.5;padding:var(--sp-5) var(--sp-4);border-radius:var(--r-card);margin-bottom:var(--sp-4)}
.quote-reveal{border-radius:var(--r-card);margin-bottom:var(--sp-4)}
.qr-title{font-size:var(--fs-cardtitle)}
.qr-btn{font-size:var(--fs-note);border-radius:999px;padding:.5rem 1rem}
.attach-note{border-radius:var(--r-ctl);font-size:var(--fs-note);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-3)}
.divider{margin:var(--sp-5) 0}

/* ── 数据 ── */
.stat-grid{gap:var(--sp-3);margin-bottom:var(--sp-4)}
.stat-card{border-radius:var(--r-card);padding:var(--sp-4) var(--sp-3);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.stat-num{font-size:2.25rem}
.stat-label{font-size:var(--fs-note)}
.stat-note{font-size:var(--fs-tag)}
.total,.tt{border-radius:var(--r-card)}

/* ── 表格、流程、对照、报站 ── */
.rt,.rs,.cmp-card{border-radius:var(--r-card);margin-bottom:var(--sp-4)}
.rt td:empty{padding-inline:0}          /* 表头少于 5 列时，空单元格收成零宽，不留残列 */
.rt table th,.rt table td{font-size:var(--fs-note);padding:10px 12px}
.rt table th{font-weight:800;letter-spacing:.02em}
.rt-cap b{font-size:var(--fs-text)}
.rs-head b{font-size:var(--fs-text)}
.rs-t{font-size:var(--fs-note)}
.rs-n{font-size:var(--fs-note);line-height:1.5}
.cmp-card{padding:var(--sp-4)}
.cmp-head h4{font-size:var(--fs-text)}
.cmp-side{border-radius:var(--r-ctl)}
.cmp-side p{font-size:var(--fs-note);line-height:1.65}
.metro-list li{font-size:var(--fs-note);line-height:1.6}
.metro-list li.ml-note{font-size:var(--fs-note);border-radius:var(--r-ctl)}
.metro-panel-title b{font-size:var(--fs-text)}
.tabset{border-radius:var(--r-card);padding:var(--sp-3);margin-bottom:var(--sp-4)}
.tab-head{font-size:var(--fs-note);border-radius:999px;padding:.5rem .875rem;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.tab-panel>.grid-1 .card{padding:var(--sp-5) var(--sp-5);border-radius:var(--r-card)}
.tab-panel>.grid{min-height:8rem}       /* 标签间高度稳定，但不再撑出大片空白 */
.tab-panel>.grid-1 .card-title{font-size:var(--fs-cardtitle)}
.step-title{font-size:var(--fs-text)}
.step-body{font-size:var(--fs-note);line-height:1.65}

/* ── 话术与仿真 ── */
.faq,.sl-group{border-radius:var(--r-ctl);margin-bottom:0}
.sl-group summary{font-size:var(--fs-note)}
.faq summary{font-size:var(--fs-cardtitle);font-weight:500;line-height:1.55;padding:1rem 1.125rem;gap:.75rem;align-items:flex-start}
.faq summary::before{inline-size:1.5rem;block-size:1.5rem;font-size:1rem;font-weight:500;line-height:1;margin-block-start:calc((1.55em - 1.5rem)/2)}
.faq-q{min-inline-size:0;overflow-wrap:anywhere}
.faq-inner{padding:0 1.125rem 1.125rem 3.375rem}
.faq-principle{font-size:var(--fs-note);border-radius:var(--r-ctl);padding:var(--sp-2) var(--sp-3)}
.faq-answer{font-size:var(--fs-text);line-height:1.7;border-radius:var(--r-ctl);padding:var(--sp-3) 3rem var(--sp-3) var(--sp-3)}
.sl-line{font-size:var(--fs-text);border-radius:var(--r-ctl)}
.sl-h{font-size:var(--fs-note)}
.sl-p{font-size:var(--fs-note);line-height:1.7}
.copy-wrap{border-radius:var(--r-ctl);padding:var(--sp-3) 2.75rem var(--sp-3) var(--sp-3)}
.copy-wrap .copy-text{font-size:var(--fs-text);line-height:1.7}
.bubble{font-size:var(--fs-text);line-height:1.6;border-radius:var(--r-card)}
.chat-cap{font-size:var(--fs-note);margin-bottom:var(--sp-3)}
.mm-text{font-size:var(--fs-text);line-height:1.7}
figure figcaption,.gallery-item figcaption{font-size:var(--fs-note)}

/* ── 导航与控制：半透明材质分层，点击区不小于 32px ── */
.layout{padding-bottom:6rem}          /* 文字放大后底栏变高，留白按 rem 一起长，避免压住正文 */
.topbar{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.brand-text{font-size:var(--fs-text)}
.topbar-title{font-size:var(--fs-note)}
.search-box input{width:13rem}
.home-btn,.search-box input,.menu-btn{border-radius:var(--r-ctl);font-size:var(--fs-note)}
.nav-group-title{font-size:.9375rem;border-radius:var(--r-ctl);padding:.5rem .625rem}
.nav-link{font-size:.875rem;border-radius:.5rem;padding:.375rem .625rem .375rem .875rem}
.pager-btn{border-radius:var(--r-ctl);font-size:.9375rem;padding:.5625rem 1rem;min-block-size:2.25rem;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.pager-pos{font-size:var(--fs-note)}
.pager-pos b{font-size:var(--fs-text)}
.xref-chip{border-radius:999px;font-size:var(--fs-note);padding:.375rem .8125rem;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}
.dl-dock>summary{border-radius:999px;font-size:var(--fs-note);box-shadow:var(--shadow-lift);min-block-size:2.625rem}
:where(a,button,summary,input,[tabindex]):focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:var(--r-ctl)}

/* ── 窄屏：字号回落到原比例，避免新令牌把移动端顶满 ── */
@media(max-width:960px){
  .section{padding:var(--sp-4) var(--sp-3)}
  .section h2{font-size:1.5rem}
  .lede{font-size:1.0625rem;padding:var(--sp-2) var(--sp-3)}
  .quote{font-size:1.25rem}
  .card,.pick-card,.callout{padding:var(--sp-3)}
  .stat-num{font-size:1.75rem}
}

/* Shared skin for existing handbook HTML; all content structure remains editable upstream. */
body{background:var(--bg);color:var(--text)}
.cover.cover-plain-mode{background:var(--bg)}
.brand-logo{block-size:var(--logo-header-height,28px);inline-size:auto;max-inline-size:11rem;object-fit:contain}
.cover-logo{block-size:var(--logo-cover-height,48px);inline-size:auto;max-inline-size:18rem;object-fit:contain}
.card,.pick-card,.tabset,.cmp-card,.rt,.rs{border-color:var(--border)}
.card,.pick-card{background:var(--surface)}
.card-title,.tab-title,.cmp-head h4{color:var(--brand)}
.card-body,.body-text,.sl-p,.cmp-side p,.rs-n{color:var(--text)}
.nav-link,.sec-sub,.card-sub,.topbar-title{color:var(--muted)}
.nav-link:hover,.nav-link.target-current,.tab-head{background:var(--accent-soft)}
.cmp-side.cmp-now{background:var(--compare-before-bg,#F7F9FC)}
.cmp-side.cmp-need{background:var(--accent-soft)}
.tab-head{color:var(--brand)}
.tab-head.on{background:var(--accent);border-color:var(--accent);color:white}
.callout-blue{background:var(--accent-soft);border-color:var(--border);color:var(--brand)}
.stat-card{background:linear-gradient(150deg,var(--surface),var(--accent-soft))}
.pagerbar{background:var(--bg)}.pagerbar::before{background:linear-gradient(180deg,transparent,var(--bg))}
.pick-card.on{background:var(--selected-bg);border-color:var(--selected-border);box-shadow:var(--selected-shadow)}
.pick-card.on .card-title{color:var(--selected-text)}
:where(a,button,summary,input,[tabindex]):focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.cover[data-surface=dark]{--cover-ink:#fff;--cover-muted:#dce5ef;--flow-paper:#102237;--flow-one:#254d72;--flow-two:#23516c;--flow-three:#343d65;--flow-wash:rgba(100,150,200,.10)}
.cover[data-surface=dark] .cover-inner{background:#102237;color:#fff}
.cover.cover-fluid-mode[data-surface=dark] .cover-inner{background:transparent}
.cover[data-surface=dark] .cover-kicker{color:#a6d5ff}
.cover[data-surface=dark] .cover-start{background:#fff;color:#142536}
.topbar[data-surface=dark]{background:#102237;color:#fff}
.topbar[data-surface=dark] .topbar-title{color:#dce5ef}

/* Fluid cover baseline · restrained blue, neutral ink, slow atmospheric motion. */
:root{--flow-paper:#f7fbff;--flow-one:#bddcf5;--flow-two:#d7e8fa;--flow-three:#e3f0f6;
 --flow-wash:rgba(255,255,255,.8);--flow-clear:rgba(255,255,255,0);--cover-ink:#142536;
 --cover-muted:#526579;--flow-ease:cubic-bezier(.45,0,.55,1)}
.cover.cover-fluid-mode{isolation:isolate;background:var(--flow-paper);overflow:auto;padding:5rem 2rem}
.cover-fluid-mode::before{display:none}
.cover-fluid{position:fixed;inset:0;z-index:-1;overflow:clip;pointer-events:none;background:var(--flow-paper)}
.flow-field{position:absolute;inline-size:100vmax;block-size:90vmax;pointer-events:none;opacity:.72}
.flow-one{inset-block-start:-58vmax;inset-inline-start:-24vmax;
 background:radial-gradient(ellipse at 50% 50%,var(--flow-one) 0%,var(--flow-clear) 65%);transform:rotate(-18deg)}
.flow-two{inset-block-end:-48vmax;inset-inline-end:-36vmax;
 background:radial-gradient(ellipse at 50% 50%,var(--flow-two) 0%,var(--flow-clear) 64%);transform:rotate(24deg)}
.flow-three{inset-block-start:-8vmax;inset-inline-end:-70vmax;
 background:radial-gradient(ellipse at 45% 50%,var(--flow-three) 0%,var(--flow-clear) 64%)}
.flow-sweep{position:absolute;inset:-35%;background:linear-gradient(118deg,var(--flow-clear) 34%,var(--flow-wash) 48%,var(--flow-clear) 61%);transform:translateX(-14%) rotate(-8deg)}
.cover-fluid-mode .cover-inner{background:transparent;border:0;border-radius:0;backdrop-filter:none;box-shadow:none;

<script>
(function(){
 const ua=navigator.userAgent||'';
 const ipad=/iPad/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>0);
 const mobile=ipad||/Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
 const narrow=innerWidth<900;
 if(!mobile&&!narrow)return;
 document.documentElement.classList.add('mobile-blocked');document.body.classList.add('mobile-blocked');
 if(document.querySelector('.mobile-block'))return;
 const screen=document.createElement('div');screen.className='mobile-block';screen.setAttribute('role','alertdialog');screen.setAttribute('aria-modal','true');
 const card=document.createElement('div');card.className='mb-card';
 const heading=document.createElement('h2');heading.textContent=mobile?'请使用电脑打开':'请扩大电脑浏览器窗口';
 const p=document.createElement('p');p.textContent=mobile?'本资料仅支持电脑端。手机和平板不开放正文与交互。':'请使用至少 900px 宽的电脑浏览器窗口查看。';
 card.append(heading,p);screen.append(card);document.body.append(screen);
})();

// 翻页导航：一次显示一个小节卡片
(function(){
  const secs=[...document.querySelectorAll('.section[id]')];
  const links=[...document.querySelectorAll('.nav-link')];
  if(!secs.length)return;
  let cur=0;
  const prev=document.getElementById('pager-prev');
  const next=document.getElementById('pager-next');
  const pos=document.getElementById('pager-pos');
  const title=document.getElementById('pager-title');
  function show(i,initial){
    cur=Math.max(0,Math.min(secs.length-1,i));
    secs.forEach((s,k)=>s.classList.toggle('active',k===cur));
    const id=secs[cur].id;
    links.forEach(a=>{const on=a.getAttribute('href')==='#'+id;
      a.classList.toggle('target-current',on);
      if(on){a.setAttribute('aria-current','true');const g=a.closest('.nav-group');
        if(g)g.open=true;
        document.querySelectorAll('.sidebar details.nav-group').forEach(d=>{if(d!==g)d.open=false;});
        // 目录自动跟随：把当前项滚进侧栏可视区
        const side=a.closest('.sidebar');
        if(side){const ar=a.getBoundingClientRect(),sr=side.getBoundingClientRect();
          if(ar.top<sr.top+40||ar.bottom>sr.bottom-20){side.scrollTo({top:side.scrollTop+(ar.top-sr.top)-100,behavior:'smooth'});}}
      }
      else a.removeAttribute('aria-current');});
    if(pos)pos.innerHTML='第 <b>'+(cur+1)+'</b> / '+secs.length+' 节';
    if(title)title.textContent=secs[cur].querySelector('h2')?.textContent||'';
    if(prev)prev.disabled=cur===0;
    if(next)next.disabled=cur===secs.length-1;
    if(!initial){
      document.body.classList.add('viewing');
      secs[cur].scrollIntoView({block:'start'}); // 定位到当前小节顶部
    } else {
      window.scrollTo({top:0,behavior:'instant'});
    }
    try{history.replaceState(null,'','#'+id);}catch(e){}
    try{window.dispatchEvent(new CustomEvent('hb:sectionchange',{detail:{index:cur,id:id}}));}catch(e){}
  }
  window.__showSection=show;
  // 封面「开始阅读」：进入正文第一小节
  const startBtn=document.getElementById('cover-start');
  if(startBtn)startBtn.addEventListener('click',()=>{
    document.body.classList.add('viewing');
    show(0);
    try{history.replaceState(null,'',location.pathname);}catch(e){}
  });
  // 顶栏「封面」：回到开场封面
  const homeBtn=document.getElementById('home-btn');
  if(homeBtn)homeBtn.addEventListener('click',()=>{
    document.body.classList.remove('viewing');
    links.forEach(a=>{a.classList.remove('target-current');a.removeAttribute('aria-current');});
    try{history.replaceState(null,'',location.pathname);}catch(e){}
    window.scrollTo({top:0,behavior:'instant'});
  });
  links.forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault();
    const i=secs.findIndex(s=>s.id===a.getAttribute('href').slice(1));
    if(i>=0)show(i);closeMenu();
  }));
  if(prev)prev.addEventListener('click',()=>show(cur-1));
  if(next)next.addEventListener('click',()=>show(cur+1));
  // 键盘左右翻页（输入框 / 弹窗 / tab / 报站控件内不触发）
  document.addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
    const lb=document.getElementById('lightbox');
    if(lb&&lb.open)return; // 弹窗打开时方向键用于切图，不翻小节
    // tab / metro 等自带方向键的控件抢占焦点时不翻页
    if(document.activeElement.closest('.sidebar,.search-box,[role="tab"],[role="tablist"],.tabset,.metro-stop,.metro,.multi-gallery,.china-map-component,.hw-fold-grid,.hw-detail-table,.hw-matrix,.scriptlib,.hw-audio'))return;
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='ArrowRight')show(cur+1);
  });
  // 交叉引用：点相关章节 chip 跳到对应小节
  document.addEventListener('click',e=>{
    const chip=e.target.closest('[data-goto]');
    if(!chip||chip.matches('.metro-stop')||chip.disabled||chip.getAttribute('aria-disabled')==='true')return;
    const i=secs.findIndex(s=>s.id===chip.getAttribute('data-goto'));
    if(i>=0){e.preventDefault();show(i);}
  });
  // 深链接：带 hash 直接进正文；否则停在封面
  const h=decodeURIComponent(location.hash.slice(1));
  const start=secs.findIndex(s=>s.id===h);
  if(start>=0){show(start,true);document.body.classList.add('viewing');}
  else show(0,true);
  window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));const i=secs.findIndex(s=>s.id===id);if(i>=0){show(i,true);document.body.classList.add('viewing');}});
})();
// 移动菜单
function closeMenu(){document.querySelector('.sidebar')?.classList.remove('open');}
document.querySelector('.menu-btn')?.addEventListener('click',()=>document.querySelector('.sidebar')?.classList.toggle('open'));
// 图片点击放大（lightbox）
(function(){
  const box=document.getElementById('lightbox');
  if(!box)return;
  const im=box.querySelector('img');
  const cap=box.querySelector('.lightbox-cap');
  const close=box.querySelector('.lightbox-close');
  // 同一组图片（同一 gallery / 图组）内左右切换
  let group=[],gi=0;
  const prevBtn=box.querySelector('.lb-prev'),nextBtn=box.querySelector('.lb-next');
  function paint(){
    if(!group.length)return;
    const el=group[gi];im.src=el.src;im.alt=el.alt||'';
    cap.textContent=el.closest('figure')?.querySelector('figcaption')?.textContent||el.alt||'';
    const multi=group.length>1;
    if(prevBtn)prevBtn.hidden=!multi;
    if(nextBtn)nextBtn.hidden=!multi;
  }
  function step(d){if(group.length<2)return;gi=(gi+d+group.length)%group.length;paint();}
  document.addEventListener('click',e=>{
    const t=e.target.closest('img.zoomable, img.avatar, .gallery-item img');
    if(!t)return;
    if(t.classList.contains('avatar'))return; // 头像是装饰，不放大
    openAt(t);
  });
  function openAt(t){
    // 收集同组图片：优先同 figure 的兄弟，其次同 gallery / 同 section 的所有可放大图
    const scope=t.closest('.gallery')||t.closest('.section')||document;
    group=[...scope.querySelectorAll('img.zoomable, .gallery-item img')].filter(x=>!x.classList.contains('avatar'));
    if(!group.includes(t))group=[t];
    gi=Math.max(0,group.indexOf(t));
    paint();box.showModal();
  }
  // 键盘：图片可聚焦，回车 / 空格打开放大
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const t=e.target.closest('img.zoomable, .gallery-item img');
    if(!t)return;
    e.preventDefault();openAt(t);
  });
  if(prevBtn)prevBtn.addEventListener('click',e=>{e.stopPropagation();step(-1);});
  if(nextBtn)nextBtn.addEventListener('click',e=>{e.stopPropagation();step(1);});
  // 关闭：优先原生 closedby="any"（背景点击 / Esc / 返回手势），仅在不支持时补兜底
  close.addEventListener('click',()=>box.close());
  if(!('closedBy' in HTMLDialogElement.prototype)){
    // 回退：指针按下与抬起都在对话框外才关闭（避免文字选中拖拽误关）
    const outside=(e)=>{const r=box.getBoundingClientRect();
      return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;};
    let pressedOutside=false;
    box.addEventListener('pointerdown',e=>{pressedOutside=outside(e);});
    box.addEventListener('pointerup',e=>{if(pressedOutside&&outside(e))box.close();pressedOutside=false;});
  }
  // 左右键翻图；Esc 由原生模态处理，不重复拦截
  box.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
    if(e.key==='ArrowRight'){e.preventDefault();step(1);}
  });
})();
// 复制：命令式 + 点击 fallback，Async Clipboard + 传统兜底（copy-button 指南）
let lastMsg='';
function legacyCopy(text){
  const f=document.createElement('textarea');f.value=text;f.setAttribute('readonly','');
  f.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.append(f);f.select();
  try{return document.execCommand('copy');}finally{f.remove();}
}
async function doCopyEl(btn,target){
  if(!target)return;
  const text=target.innerText.trim();if(!text)return;
  let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);ok=true;}}catch(e){}
  if(!ok)ok=legacyCopy(text);
  report(btn,ok);
}
function report(btn,ok){
  clearTimeout(btn._t);btn.removeAttribute('data-copied');btn.removeAttribute('data-failed');
  const tip=btn.nextElementSibling;let msg=ok?'已复制':'复制失败';
  if(msg===lastMsg)msg+='\u00A0';lastMsg=msg;
  void btn.offsetWidth;btn.setAttribute(ok?'data-copied':'data-failed','');
  requestAnimationFrame(()=>{if(tip)tip.textContent=msg;});
  btn._t=setTimeout(()=>{btn.removeAttribute('data-copied');btn.removeAttribute('data-failed');if(tip)tip.textContent='';},1800);
}
// Invoker Commands：command 事件不冒泡，用捕获阶段监听；event.source 是按钮，event.target 是 commandfor 元素
document.addEventListener('command',e=>{
  if(e.command!=='--copy')return;
  doCopyEl(e.source,e.target);
},true);
// 只有不支持 CommandEvent 的环境才注册点击路径，避免一次点击复制两次
if(!('CommandEvent' in window)){
  document.addEventListener('click',e=>{
    const b=e.target.closest('.copy-button[command]');if(!b)return;
    doCopyEl(b,document.getElementById(b.getAttribute('commandfor')));
  });
}
// 原生单选卡：浏览器处理方向键、空格、禁用；高亮与 checked 同步。
(function(){
  document.querySelectorAll('.pick-grid').forEach(grid=>{
    const cards=[...grid.querySelectorAll('.pick-card')];
    grid.addEventListener('change',e=>{
      if(!e.target.matches('.pick-control'))return;
      cards.forEach(c=>c.classList.toggle('on',c.querySelector('.pick-control').checked));
    });
  });
})();
// Tab 切换（点击 + 键盘方向键 / Home / End，符合 tablist 交互）
(function(){
  document.querySelectorAll('.tabset').forEach(set=>{
    const heads=[...set.querySelectorAll('.tab-head')], panels=[...set.querySelectorAll('.tab-panel')];
    heads.forEach(h=>{h.tabIndex=h.classList.contains('on')?0:-1;});
    function pick(i,focus){
      heads.forEach((x,k)=>{const on=k===i;x.classList.toggle('on',on);x.tabIndex=on?0:-1;
        x.setAttribute('aria-selected',String(on));});
      panels.forEach(p=>p.classList.toggle('on',p.dataset.idx===String(i)));
      if(focus)heads[i].focus();
      set.dispatchEvent(new CustomEvent('hb:tabchange',{bubbles:true,detail:{key:heads[i].dataset.tabKey}}));
    }
    heads.forEach((h,i)=>{
      h.addEventListener('click',()=>pick(i,false));
      h.addEventListener('keydown',e=>{
        let n=null;
        if(e.key==='ArrowRight'||e.key==='ArrowDown')n=(i+1)%heads.length;
        else if(e.key==='ArrowLeft'||e.key==='ArrowUp')n=(i-1+heads.length)%heads.length;
        else if(e.key==='Home')n=0;
        else if(e.key==='End')n=heads.length-1;
        if(n!==null){e.preventDefault();pick(n,true);}
      });
    });
  });
})();
// 地铁报站导航
(function(){  document.querySelectorAll('.metro').forEach(metro=>{
    const track=metro.querySelector('.metro-track');
    const stops=[...metro.querySelectorAll('.metro-stop')],panels=[...metro.querySelectorAll('.metro-panel')];
    const fill=metro.querySelector('.metro-fill'),train=metro.querySelector('.metro-train');
    const now=metro.querySelector('.metro-now b'),nextChip=metro.querySelector('.metro-next');
    if(!stops.length)return;
    let current=Math.max(0,stops.findIndex(s=>s.classList.contains('on')));
    function place(i){
      if(!track||!fill||!train)return;
      const tr=track.getBoundingClientRect();
      const dots=stops.map(s=>s.querySelector('.metro-dot').getBoundingClientRect());
      const first=dots[0].left+dots[0].width/2-tr.left,cur=dots[i].left+dots[i].width/2-tr.left;
      fill.style.left=first+'px';fill.style.width=Math.max(0,cur-first)+'px';train.style.left=cur+'px';
    }
    function go(i){
      current=i;
      stops.forEach((s,k)=>{const on=k===i;s.classList.toggle('on',on);s.setAttribute('aria-pressed',String(on));});
      panels.forEach(p=>p.classList.toggle('on',p.dataset.stop===String(i)));
      if(now)now.textContent=stops[i].querySelector('.metro-label b')?.textContent||'';
      if(nextChip){const nx=stops[i+1]?.querySelector('.metro-label b')?.textContent||'';
        nextChip.hidden=!nx;const nb=nextChip.querySelector('b');if(nb)nb.textContent=nx;}
      place(i);
    }
    stops.forEach((s,i)=>s.addEventListener('click',()=>{
      go(i);
      if(metro.dataset.nav==='1'&&s.dataset.goto&&window.__showSection){
        const list=[...document.querySelectorAll('.section[id]')];
        const idx=list.indexOf(document.getElementById(s.dataset.goto));
        if(idx>=0)window.__showSection(idx);
      }
    }));
    go(current);
    window.addEventListener('resize',()=>place(current),{passive:true});
    window.addEventListener('hb:sectionchange',()=>{if(metro.getBoundingClientRect().width>0)place(current);});
  });
})();
// 数字滚动：进入当前小节时从 0 滚向目标值；尊重系统「减少动态」设置
(function(){
  const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function fmt(v,decimals){
    if(decimals>0)return v.toFixed(decimals);
    return String(Math.round(v));
  }
  function run(el){
    if(el.dataset.done==='1')return;
    el.dataset.done='1';
    const raw=el.getAttribute('data-count')||'0';
    const target=parseFloat(raw.replace(/[^0-9.]/g,''))||0;
    const decimals=(raw.split('.')[1]||'').length;
    const dur=parseInt(el.getAttribute('data-dur')||'1100',10);
    const vEl=el.querySelector('.stat-v');
    if(!vEl)return;
    if(reduce){vEl.textContent=fmt(target,decimals);return;}
    const t0=performance.now();
    function tick(now){
      const p=Math.min(1,(now-t0)/dur);
      const eased=1-Math.pow(1-p,3); // easeOutCubic
      vEl.textContent=fmt(target*eased,decimals);
      if(p<1)requestAnimationFrame(tick);
      else vEl.textContent=fmt(target,decimals);
    }
    requestAnimationFrame(tick);
  }
  function runIn(section){
    if(!section)return;
    section.querySelectorAll('[data-count]').forEach(el=>{
      // 每次进入该节都重播：先清空标记
      el.dataset.done='';
      run(el);
    });
  }
  // 首屏：若已直接进入正文
  const first=document.querySelector('.section.active');
  if(first)runIn(first);
  window.addEventListener('hb:sectionchange',e=>{
    const list=[...document.querySelectorAll('.section[id]')];
    runIn(list[e.detail.index]);
  });
})();
// 顶部阅读进度条（按「第几节 + 本节滚动比例」计算；只写 transform，rAF 节流）
(function(){
  const bar=document.querySelector('.read-progress');
  if(!bar)return;
  let ticking=false;
  function upd(){
    const secs=[...document.querySelectorAll('.section[id]')];
    if(!secs.length){bar.style.setProperty('--p','0');return;}
    const active=document.querySelector('.section.active');
    const idx=active?secs.indexOf(active):0;
    const sc=window.scrollY||document.documentElement.scrollTop;
    const docH=document.documentElement.scrollHeight-window.innerHeight;
    const inner=docH>0?Math.min(1,Math.max(0,sc/docH)):0;
    const pct=Math.min(1,(Math.max(0,idx)+inner)/secs.length);
    bar.style.setProperty('--p',pct.toFixed(4));
    ticking=false;
  }
  function onScroll(){if(!ticking){ticking=true;requestAnimationFrame(upd);}}
  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',onScroll,{passive:true});
  window.addEventListener('hb:sectionchange',()=>setTimeout(upd,30));
  upd();
})();

  document.querySelectorAll('.moments').forEach(card=>{

    const send=card.querySelector('.mm-comment-send'),list=card.querySelector('.mm-comments');
    function burst(btn){
      if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
      const wrap=document.createElement('span');wrap.className='mm-heart-burst';
      const xs=[-26,-12,0,12,26],ys=[-32,-44,-52,-42,-30],rs=['-18deg','-8deg','0deg','9deg','18deg'];

    }

      const on=!like.classList.contains('on');
      like.classList.toggle('on',on);like.setAttribute('aria-pressed',String(on));
      const lt=card.querySelector('.mm-likes-text');
      if(lt){const base=lt.dataset.base||'';
        if(on){lt.textContent='';const me=document.createElement('span');me.className='mm-like-me';me.textContent='我';
          lt.append(me,document.createTextNode('、'+base));}else lt.textContent=base;}
      if(on)burst(like);

      const open=box.classList.toggle('open');comment.setAttribute('aria-expanded',String(open));
      card.classList.remove('comments-shown');void card.offsetWidth;card.classList.add('comments-shown');
