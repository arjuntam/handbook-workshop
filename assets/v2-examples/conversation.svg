<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1415" viewBox="0 0 720 1415"><rect width="720" height="1415" fill="#f6f1e9"/><text x="35" y="65" font-size="30" fill="#20494b">资料交接 · 演示对话</text><text x="35" y="105" font-size="20" fill="#65736b">原创内容，非真实客户聊天记录</text><rect x="35" y="155" width="580" height="142" rx="18" fill="#ffffff"/><text x="59" y="189" font-size="22" font-weight="600" fill="#1b5863">制作人</text><text x="59" y="231" font-size="26" fill="#253a40">示例项目甲的原稿已经登记，共8份。请</text><text x="59" y="267" font-size="26" fill="#253a40">帮忙确认图片和附件。</text><rect x="100" y="325" width="580" height="142" rx="18" fill="#e2eeeb"/><text x="124" y="359" font-size="22" font-weight="600" fill="#1b5863">协作人</text><text x="124" y="401" font-size="26" fill="#253a40">图片是12张，附件是3份，都是本次演</text><text x="124" y="437" font-size="26" fill="#253a40">示材料。</text><rect x="35" y="495" width="580" height="142" rx="18" fill="#ffffff"/><text x="59" y="529" font-size="22" font-weight="600" fill="#1b5863">制作人</text><text x="59" y="571" font-size="26" fill="#253a40">收到。我会分开显示数量，不把它们相加</text><text x="59" y="607" font-size="26" fill="#253a40">作为完成度。</text><rect x="100" y="665" width="580" height="142" rx="18" fill="#e2eeeb"/><text x="124" y="699" font-size="22" font-weight="600" fill="#1b5863">协作人</text><text x="124" y="741" font-size="26" fill="#253a40">示例项目乙的图片还没有提供，附件已确</text><text x="124" y="777" font-size="26" fill="#253a40">认不需要。</text><rect x="35" y="835" width="580" height="142" rx="18" fill="#ffffff"/><text x="59" y="869" font-size="22" font-weight="600" fill="#1b5863">制作人</text><text x="59" y="911" font-size="26" fill="#253a40">图片标“未提供”，附件标“0”，避免</text><text x="59" y="947" font-size="26" fill="#253a40">接手的人误判。</text><rect x="100" y="1005" width="580" height="142" rx="18" fill="#e2eeeb"/><text x="124" y="1039" font-size="22" font-weight="600" fill="#1b5863">协作人</text><text x="124" y="1081" font-size="26" fill="#253a40">示例项目丙的附件还在确认，先保留待确</text><text x="124" y="1117" font-size="26" fill="#253a40">认状态。</text><rect x="35" y="1175" width="580" height="142" rx="18" fill="#ffffff"/><text x="59" y="1209" font-size="22" font-weight="600" fill="#1b5863">制作人</text><text x="59" y="1251" font-size="26" fill="#253a40">交接说明会分别列出缺口，并给出后续更</text><text x="59" y="1287" font-size="26" fill="#253a40">新的位置。</text><text x="35" y="1377" font-size="20" fill="#65736b">结束 · 继续核对资料与来源</text></svg>