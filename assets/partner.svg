<svg xmlns="http://www.w3.org/2000/svg" viewBox="102 60 820 512" width="820" height="512" role="img" aria-label="招商宣讲：双方签署城市合伙人协议，达成合作">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f8ff"/><stop offset="1" stop-color="#e6f1fd"/>
    </linearGradient>
    <linearGradient id="ppaper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6faff"/>
    </linearGradient>
    <linearGradient id="ppen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ba3e8"/><stop offset="1" stop-color="#2f6fb5"/>
    </linearGradient>
    <linearGradient id="pstamp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7bd6a"/><stop offset="1" stop-color="#e8942c"/>
    </linearGradient>
    <filter id="pShadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b4f8a" flood-opacity="0.16"/>
    </filter>
    <filter id="pChip" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1b4f8a" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="640" fill="url(#pbg)"/>
  <circle cx="892" cy="128" r="132" fill="#dcecff" opacity="0.6"/>
  <circle cx="132" cy="540" r="112" fill="#dcecff" opacity="0.55"/>

  <!-- 合同纸（微旋转） -->
  <g transform="rotate(-5 420 300)" filter="url(#pShadow)">
    <rect x="268" y="148" width="304" height="330" rx="14" fill="url(#ppaper)" stroke="#dbe8f6" stroke-width="2"/>
    <!-- 文件抬头 -->
    <rect x="300" y="182" width="150" height="16" rx="8" fill="#2f6fb5" opacity="0.9"/>
    <rect x="300" y="210" width="96" height="9" rx="4.5" fill="#c9dcef"/>
    <!-- 正文行 -->
    <g fill="#e3edf8">
      <rect x="300" y="248" width="240" height="10" rx="5"/>
      <rect x="300" y="270" width="212" height="10" rx="5"/>
      <rect x="300" y="292" width="236" height="10" rx="5"/>
      <rect x="300" y="314" width="168" height="10" rx="5"/>
      <rect x="300" y="336" width="224" height="10" rx="5"/>
      <rect x="300" y="358" width="140" height="10" rx="5"/>
    </g>
    <!-- 签约线 -->
    <line x1="300" y1="428" x2="470" y2="428" stroke="#c9dcef" stroke-width="2.5" stroke-dasharray="7 7"/>
    <rect x="300" y="440" width="60" height="8" rx="4" fill="#e3edf8"/>
  </g>

  <!-- 印章 -->
  <g transform="rotate(-12 540 402)" filter="url(#pChip)">
    <circle cx="540" cy="402" r="46" fill="url(#pstamp)"/>
    <circle cx="540" cy="402" r="36" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.75"/>
    <path d="M522 402l12 13 24-27" fill="none" stroke="#ffffff" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 笔 -->
  <g transform="rotate(38 630 250)" filter="url(#pChip)">
    <rect x="606" y="150" width="20" height="150" rx="6" fill="url(#ppen)"/>
    <path d="M606 300h20l-10 26z" fill="#1b4f8a"/>
    <rect x="606" y="150" width="20" height="34" rx="6" fill="#8ec4f0"/>
    <rect x="604" y="184" width="24" height="10" rx="3" fill="#f2a33c"/>
  </g>

  <!-- 达成标识 -->
  <g transform="translate(228,228)" filter="url(#pChip)">
    <circle cx="0" cy="0" r="30" fill="#3b82c9"/>
    <path d="M-12 0l9 10 17-20" fill="none" stroke="#ffffff" stroke-width="6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 装饰 -->
  <g opacity="0.9">
    <circle cx="716" cy="452" r="9" fill="#9fc8ee"/>
    <circle cx="740" cy="472" r="5" fill="#f2a33c"/>
    <circle cx="196" cy="392" r="7" fill="#9fc8ee"/>
    <circle cx="742" cy="196" r="6" fill="#f2a33c"/>
  </g>
</svg>
