<!DOCTYPE html>
<html lang="zh-CN" data-shell="light"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="text-scale" content="scale">
<meta name="description" content="样式示例">
<title>城市合伙人 · 启动会执行手册</title>
<style>
:root{
  --brand:#0d3b66; --brand2:#1b5c96; --accent:#2b7fd4; --accent-soft:#e8f1fb;
  --bg:#f4f6f9; --surface:#fff; --text:#1b2733; --muted:#63748a; --border:#e2e8f0;
  --green:#1f8a5b; --green-soft:#e8f6ef; --red:#c0392b; --red-soft:#fdecea;
  --amber:#9a6b12; --amber-soft:#fdf3e0; --radius:14px; --shadow:0 2px 14px rgba(16,42,71,.07);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
a{color:inherit}
/* 顶栏 */
.topbar{position:sticky;top:0;z-index:50;height:60px;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:.04em;color:var(--brand);white-space:nowrap}
.brand-mark{width:26px;height:26px;background:var(--brand);color:#fff;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:900}
.brand-logo{height:26px;width:auto;display:block}
.brand-text{font-size:16px;font-weight:800;color:var(--brand);white-space:nowrap}
.topbar-title{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-sp{flex:1}
.home-btn{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border:1px solid var(--border);
  background:#fff;color:var(--brand2);border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s}
.home-btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.home-btn svg{width:17px;height:17px}
.search-box{position:relative;flex:none}
.search-box input{width:210px;height:36px;border:1px solid var(--border);background:#fff;border-radius:9px;padding:0 12px 0 34px;font-size:13px;outline:none;transition:border .15s,box-shadow .15s}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
/* 键盘焦点统一可见（鼠标点击不显示） */
:where(a,button,summary,input,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.section:focus{outline:none}
.search-box svg{position:absolute;left:10px;top:9px;width:17px;height:17px;color:var(--muted)}
.menu-btn{display:none;width:38px;height:38px;border:1px solid var(--border);background:#fff;border-radius:9px;font-size:18px;cursor:pointer}
/* 布局 */
.layout{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:248px minmax(0,1fr);gap:32px;padding:28px 24px 96px}
.sidebar{position:sticky;top:88px;align-self:start;max-height:calc(100vh - 110px);overflow:auto;padding-right:6px}
.side-hint{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:4px 10px 12px;font-weight:700}
.nav-group{margin-bottom:2px;border-bottom:1px solid #edf1f6;padding-bottom:6px}
.nav-group summary{list-style:none;cursor:pointer;user-select:none}
.nav-group summary::-webkit-details-marker{display:none}
.nav-group-title{display:flex;align-items:center;justify-content:space-between;font-size:14.5px;font-weight:800;color:var(--brand);padding:10px 10px;letter-spacing:.01em;border-radius:7px}
.nav-group-title:hover{background:#eef3f9;color:var(--brand)}
.nav-group-title::after{content:"▾";font-size:11px;transition:transform .18s;color:#9fb0c4}
.nav-group[open] .nav-group-title::after{transform:rotate(180deg)}
.nav-group-links{padding:2px 0}
.nav-link{display:flex;align-items:center;gap:7px;padding:6px 11px 6px 14px;border-radius:8px;color:#5c7189;text-decoration:none;font-size:13px;line-height:1.4;margin:1px 0;transition:background .12s,color .12s}
.nav-link:hover{background:#eef3f9;color:var(--brand)}
.nav-link.target-current{background:var(--accent-soft);color:var(--brand2);font-weight:700}
.nav-link .nav-dot{width:5px;height:5px;border-radius:50%;background:#b9c6d6;flex:none}
.nav-link.target-current .nav-dot{background:var(--accent)}
main{min-width:0}
/* 章节：一次显示一节（翻页模式） */
.section{scroll-margin-top:84px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:38px 44px;margin-bottom:14px;display:none}
.section.active{display:block}
.section .section-head:first-child{margin-top:0}
/* 翻页导航 */
.pagerbar{position:fixed;left:0;right:0;bottom:0;z-index:40;pointer-events:none;
  background:#f7fafd;
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px)}
.pagerbar::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:20px;
  background:linear-gradient(180deg,rgba(247,250,254,0),#f7fafd);pointer-events:none}
.pager{pointer-events:auto;max-width:1360px;margin:0 auto;
  padding:var(--sp-1) 24px var(--sp-1) 304px;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.pager>#pager-prev{justify-self:start}
.pager>#pager-next{justify-self:end}
.pager-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--brand2);
  border-radius:10px;padding:9px 16px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;
  box-shadow:0 2px 8px rgba(16,42,71,.05);transition:background .15s,border-color .15s}
.pager-pos{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pager-pos b{color:var(--brand2);font-size:15px}
.pager-label{display:block;font-size:11px;color:var(--muted);font-weight:500}
.section-head{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.sec-kicker{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);
  padding:4px 10px;border-radius:20px;margin-bottom:12px}
.section h2{margin:0 0 8px;font-size:26px;line-height:1.35;color:var(--brand);letter-spacing:-.01em}
.sec-sub{margin:0;color:var(--muted);font-size:15px}
.lede{font-size:16.5px;color:#2b3a4b;background:linear-gradient(90deg,var(--accent-soft),transparent);
  border-left:4px solid var(--accent);padding:14px 18px;border-radius:0 10px 10px 0;margin:0 0 22px}
.body-text{margin:0 0 16px;color:#33445a}
.subhead{font-size:17px;color:var(--brand);margin:26px 0 14px;padding-left:11px;border-left:3px solid var(--accent)}
/* 卡片网格 */
.grid{display:grid;gap:16px;margin:0 0 18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{position:relative;border:1px solid var(--border);border-radius:12px;padding:20px;background:#fcfdfe;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:var(--shadow);transform:translateY(-2px)}
.card-num{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;background:var(--brand);color:#fff;
  font-size:12px;font-weight:800;margin-bottom:10px}
.card-title{font-size:16px;margin:0 0 8px;color:var(--brand2);line-height:1.45;display:flex;align-items:center;gap:9px}
.card-icon{width:22px;height:22px;object-fit:contain;flex:none}
.card-sub{font-size:12px;color:var(--accent);font-weight:700;margin:-3px 0 8px}
.card-body{font-size:14px;color:#455a72;margin:0;line-height:1.7}
.card-img{margin:14px 0 0}
.card-img img{width:100%;border-radius:9px;display:block}
.card-img figcaption{font-size:12px;color:var(--muted);margin-top:7px}
/* 数字统计卡（滚动计数） */
.stat-grid{display:grid;gap:14px;margin:0 0 20px}
.stat-grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.stat-grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat-grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.stat-card{position:relative;border:1px solid var(--border);border-radius:13px;padding:20px 16px;background:linear-gradient(160deg,#fbfdff,#f2f7fc);text-align:center;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s}
.stat-card::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--accent),var(--brand2));opacity:.85}
.stat-card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#cfe1f5}
.stat-num{font-size:34px;font-weight:900;line-height:1.1;color:var(--brand);letter-spacing:-.01em;font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;gap:1px}
.stat-num .stat-suffix{font-size:20px;font-weight:800;color:var(--accent)}
.stat-num .stat-prefix{font-size:20px;font-weight:800;color:var(--accent)}
.stat-label{font-size:13px;color:#41546a;margin-top:8px;font-weight:700;line-height:1.4}
.stat-note{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.5}
/* 仅屏幕阅读器可见 */
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* 进场动画：小节切换时卡片依次上浮（默认静态，仅在允许动效时启用） */
@media(prefers-reduced-motion:no-preference){
  .section.active .anim-item{animation:riseIn .42s cubic-bezier(.22,.68,.36,1) both;animation-delay:var(--d,0ms)}
}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
/* 顶部阅读进度条：只用 transform 合成，不触发布局 */
.read-progress{position:fixed;top:0;left:0;height:3px;width:100%;background:linear-gradient(90deg,var(--accent),var(--brand2));
  z-index:60;transform:scaleX(var(--p,0));transform-origin:0 50%;transition:transform .18s ease;pointer-events:none;will-change:transform}
@media(prefers-reduced-motion:reduce){.read-progress{transition:none}}
/* 提示卡 */
.callout{border-radius:11px;padding:15px 18px;margin:0 0 18px;border:1px solid}
.callout-label{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:2px 9px;border-radius:6px;margin-bottom:7px}
.callout-body{font-size:14.5px;line-height:1.75}
.callout-blue{background:var(--accent-soft);border-color:#cfe1f5;color:#1c4a7a}
.callout-blue .callout-label{background:var(--accent);color:#fff}
.callout-red{background:var(--red-soft);border-color:#f6cfc9;color:#8d2c20}
.callout-red .callout-label{background:var(--red);color:#fff}
.callout-green{background:var(--green-soft);border-color:#c7e9d7;color:#1c6646}
.callout-green .callout-label{background:var(--green);color:#fff}
.callout-amber{background:var(--amber-soft);border-color:#f0dfb8;color:#7d5710}
.callout-amber .callout-label{background:var(--amber);color:#fff}
/* 对话气泡 */
.chat{background:#f7f9fc;border:1px solid var(--border);border-radius:13px;padding:20px;margin:0 0 18px}
.chat-cap{font-size:13px;color:var(--muted);margin-bottom:16px;text-align:center;font-weight:600}
.bubble-row{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start}
.bubble-row.client{flex-direction:row-reverse}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.12)}
.avatar-ph{display:grid;place-items:center;background:#e6effa;color:#3f7fb8;font-size:14px;font-weight:800;overflow:hidden}
.avatar-ph svg{width:22px;height:22px;fill:currentColor}
.avatar-ph.client{background:#eef2f7;color:#93a7ba}
.bubble{position:relative;max-width:min(78%,620px);background:#fff;border:1px solid #dfe7f0;border-radius:4px 13px 13px 13px;
  padding:12px 42px 12px 15px;font-size:14.5px;line-height:1.72;box-shadow:0 1px 3px rgba(16,42,71,.04)}
.bubble-row.client .bubble{background:#dceafc;border-color:#cddff4;border-radius:13px 4px 13px 13px}
.bubble .copy{position:absolute;top:7px;right:8px}
/* 仿真微信朋友圈 */
.moments{background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px 24px 16px;margin:0 0 20px;
  box-shadow:0 3px 16px rgba(16,42,71,.06)}
.mm-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.mm-avatar{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#2f7fd6,#1b5fa8);flex:none;
  display:grid;place-items:center;overflow:hidden}
.mm-avatar svg{width:30px;height:30px;fill:#fff}
.mm-name{font-size:16px;font-weight:800;color:#1a3a5c;line-height:1.3}
.mm-time{font-size:13px;color:#9aa9bb;margin-left:auto;font-weight:500}
.mm-text{font-size:15px;line-height:1.8;color:#263748;margin:0 0 14px;word-break:break-word}
.mm-photos{display:grid;gap:4px;margin:0 0 14px;max-width:520px}
.mm-photos-1{grid-template-columns:1fr;max-width:340px}
.mm-photos-2{grid-template-columns:repeat(2,1fr);max-width:400px}
.mm-photos-3{grid-template-columns:repeat(3,1fr)}
.mm-photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:5px;background:#eef2f7;display:block;cursor:zoom-in}
.mm-actions{display:flex;gap:20px;border-top:1px solid #eef2f7;padding-top:12px}
.mm-act{width:26px;height:26px;display:grid;place-items:center;color:#aab7c6}
.mm-act svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
/* 步骤 */
.steps{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:12px}
.step{display:flex;gap:14px;background:#fcfdfe;border:1px solid var(--border);border-radius:11px;padding:15px 17px}
.step-n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--brand2);font-weight:800;
  font-size:13px;display:grid;place-items:center}
.step-title{font-size:15px;margin:2px 0 4px;color:var(--brand2)}
.step-body{font-size:14px;color:#4a5e75;line-height:1.68}
/* 图片画廊 */
.gallery{display:grid;gap:14px;margin:0 0 18px}
.gallery-2{grid-template-columns:repeat(2,1fr)} .gallery-3{grid-template-columns:repeat(3,1fr)} .gallery-4{grid-template-columns:repeat(4,1fr)}
.gallery-item{margin:0;background:#f7f9fc;border:1px solid var(--border);border-radius:10px;padding:8px;display:flex;flex-direction:column}
.gallery-item img{width:100%;object-fit:contain;border-radius:6px;display:block;cursor:zoom-in;background:#fff;transition:opacity .15s}
.gallery-1 .gallery-item img{height:300px} .gallery-2 .gallery-item img{height:210px} .gallery-3 .gallery-item img{height:170px} .gallery-4 .gallery-item img{height:140px}
.gallery-item img:hover{opacity:.9}
.gallery-item figcaption{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45;text-align:center;min-height:34px}
figure:not(.gallery-item) img{max-width:100%;height:auto;object-fit:contain;border-radius:10px;display:block;border:1px solid var(--border);cursor:zoom-in}
figure figcaption{font-size:12.5px;color:var(--muted);margin-top:8px}
/* 点击放大 lightbox */
.lightbox{position:fixed;inset:0;z-index:200;border:0;padding:0;background:rgba(8,20,34,.9);align-items:center;justify-content:center}
.lightbox[open]{display:flex}
.lightbox:modal{overscroll-behavior:contain}
.lightbox::backdrop{overflow:hidden;overscroll-behavior:contain}
.lightbox img{max-width:94vw;max-height:90vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 70px rgba(0,0,0,.5)}
.lightbox-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.15);
  color:#fff;font-size:26px;cursor:pointer;line-height:1;display:grid;place-items:center}
.lightbox-close:hover{background:rgba(255,255,255,.28)}
.lb-prev,.lb-next{position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;border:0;
  background:rgba(255,255,255,.14);color:#fff;font-size:34px;line-height:1;cursor:pointer;display:grid;place-items:center;
  transition:background .15s,transform .15s;backdrop-filter:blur(4px)}
.lb-prev{left:3vw}.lb-next{right:3vw}
.lb-prev:hover,.lb-next:hover{background:rgba(255,255,255,.3);transform:translateY(-50%) scale(1.06)}
.lb-prev[hidden],.lb-next[hidden]{display:none}
.lightbox-cap{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.85);font-size:13px;
  background:rgba(0,0,0,.4);padding:6px 16px;border-radius:20px;max-width:80vw;text-align:center}
/* 金句 / 提示 / 分割 */
.quote{margin:0 0 18px;padding:20px 24px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-radius:12px;
  font-size:18px;line-height:1.6;font-weight:600;text-align:center}
/* 点击揭晓金句：大标题 + 闪动按钮引导 */
.quote-reveal{border:1px solid var(--border);border-radius:14px;background:#f8fbff;margin:0 0 18px;overflow:hidden}
.quote-reveal summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:18px 22px;user-select:none;transition:background .15s}
.quote-reveal summary::-webkit-details-marker{display:none}
.quote-reveal summary:hover{background:#eef4fb}
.qr-title{font-size:21px;font-weight:800;color:var(--brand);letter-spacing:.01em}
.qr-btn{display:inline-flex;align-items:center;gap:4px;padding:9px 16px;border-radius:22px;
  background:var(--accent);color:#fff;font-size:13.5px;font-weight:700;flex:none;
  animation:qrPulse 2.1s ease-out infinite}
.qr-btn svg{margin-right:-2px}
.quote-reveal summary:hover .qr-btn{background:var(--brand2)}
.quote-reveal[open] .qr-btn{display:none}
.quote-reveal[open] summary{padding-bottom:14px;border-bottom:1px dashed var(--border)}
.quote-reveal .quote{margin:0;border-radius:0 0 13px 13px}
@keyframes qrPulse{0%{box-shadow:0 0 0 0 rgba(43,127,212,.42)}70%{box-shadow:0 0 0 11px rgba(43,127,212,0)}100%{box-shadow:0 0 0 0 rgba(43,127,212,0)}}
@media (prefers-reduced-motion:reduce){.qr-btn{animation:none}}
@media(max-width:600px){.qr-title{font-size:17px}.quote-reveal summary{padding:14px 16px}.qr-btn{padding:8px 13px;font-size:12.5px}}
.attach-note{display:flex;gap:10px;align-items:flex-start;background:var(--amber-soft);border:1px solid #f0dfb8;color:#7d5710;
  border-radius:10px;padding:12px 16px;font-size:13.5px;margin:0 0 16px}
.attach-ico{font-size:16px;line-height:1.4}
.divider{border:0;border-top:1px dashed var(--border);margin:26px 0}
/* FAQ 折叠 */
.faq-list{display:grid;gap:9px;margin-bottom:16px}
.faq{border:1px solid var(--border);border-radius:10px;background:#fcfdfe;overflow:hidden}
.faq summary{cursor:pointer;padding:13px 16px;font-weight:650;color:var(--brand2);list-style:none;display:flex;align-items:center;gap:9px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"+";width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-weight:800;flex:none}
.faq[open] summary::before{content:"−"}
.faq-inner{padding:0 16px 16px 45px}
.faq-principle{font-size:13.5px;color:#5a6b80;background:#f4f7fb;border-radius:8px;padding:10px 13px;margin-bottom:12px}
.faq-principle b{color:var(--brand2);margin-right:8px}
.faq-answer{position:relative;font-size:14px;line-height:1.75;background:#eef4fb;border:1px solid #dbe8f6;border-radius:9px;padding:13px 46px 13px 14px}
/* 话术库 */
.scriptlib{display:grid;gap:9px}
.sl-group{border:1px solid var(--border);border-radius:10px;background:#fcfdfe;overflow:hidden}
.sl-flat-h{display:flex;align-items:center;padding:13px 16px;font-size:13.5px;font-weight:800;color:var(--brand);
  background:linear-gradient(180deg,#f6fafd,#fcfdfe)}
.sl-flat .sl-body{padding-top:12px}

/* 复制按钮（copy-button 指南） */

  border-left:3px solid #cfe1f5;border-radius:8px}
.copy-wrap .copy{position:absolute;top:6px;right:6px}
.copy-wrap .copy-text{font-size:14px;line-height:1.8;color:#33475c}

.copy{position:relative;display:inline-grid;place-items:center}
.copy-button{min-inline-size:26px;min-block-size:26px;width:26px;height:26px;border:1px solid var(--border);background:#fff;color:var(--muted);
  border-radius:7px;cursor:pointer;display:grid;place-items:center;transition:color .15s,background .15s,border .15s}
.copy-button:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.copy-button svg{width:15px;height:15px}
.copy-button[data-copied]{color:var(--green);border-color:var(--green);background:var(--green-soft)}
.copy-button[data-failed]{color:var(--red);border-color:var(--red);background:var(--red-soft)}

/* ── 令牌：字号用 rem，跟随系统/浏览器文字缩放；间距取 8 的倍数 ── */
:root{
  --fs-title:1.75rem;--fs-h3:1.3125rem;--fs-cardtitle:1.1875rem;
  --fs-lede:1.125rem;--fs-body:1.0625rem;--fs-text:1rem;
  --fs-note:.8125rem;--fs-tag:.6875rem;
  --sp-1:.5rem;--sp-2:.75rem;--sp-3:1rem;--sp-4:1.5rem;--sp-5:2rem;--sp-6:2.5rem;
  --r-ctl:.75rem;--r-card:1rem;
  --dur-fast:120ms;--dur:250ms;--ease:cubic-bezier(.2,0,0,1);
  --radius:1rem;
  --shadow:0 1px 2px rgba(16,42,71,.05),0 8px 24px rgba(16,42,71,.05);
  --shadow-lift:0 1px 2px rgba(16,42,71,.06),0 12px 32px rgba(16,42,71,.08);
}
html{-webkit-text-size-adjust:100%}
body{font-size:var(--fs-body);line-height:1.65}

/* ── 排版层级：字号与字重成对使用，标题靠字重和留白分层，不靠颜色堆 ── */
.section{padding:var(--sp-6) var(--sp-6);border-radius:var(--r-card)}
.section-head{margin-bottom:var(--sp-5);padding-bottom:var(--sp-3)}
.section h2{font-size:var(--fs-title);line-height:1.3;letter-spacing:-.012em;margin:0 0 var(--sp-1)}
.sec-sub{font-size:var(--fs-text);line-height:1.6;margin-top:var(--sp-1)}
.sec-kicker{font-size:var(--fs-tag);letter-spacing:.1em;border-radius:999px;padding:.25rem .625rem;margin-bottom:var(--sp-2)}
.lede{font-size:var(--fs-lede);line-height:1.6;padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-4);
  border-radius:0 var(--r-ctl) var(--r-ctl) 0;border-left-width:4px}
.body-text{font-size:var(--fs-body);line-height:1.75;margin-bottom:var(--sp-3)}
.subhead{font-size:var(--fs-h3);line-height:1.4;margin:var(--sp-5) 0 var(--sp-3)}

/* ── 卡片：一档圆角、一档阴影，hover 只上浮 1px 配柔和投影 ── */
.grid{gap:var(--sp-3);margin-bottom:var(--sp-4)}
.card,.pick-card{padding:var(--sp-4);border-radius:var(--r-card);background:#fff;
  transition:box-shadow var(--dur) var(--ease),transform var(--dur) var(--ease)}
.card:hover,.pick-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-lift);border-color:#d9e4f0}
.card-title{font-size:var(--fs-cardtitle);line-height:1.35;margin-bottom:var(--sp-1)}
.card-sub{font-size:var(--fs-note);margin:-.25rem 0 var(--sp-1)}
.card-body{font-size:var(--fs-text);line-height:1.6;color:#3f5468}
.card-num{border-radius:.5rem;font-size:var(--fs-tag)}
.card-img{margin-top:var(--sp-3)}
.card-img img{border-radius:var(--r-ctl)}

/* ── 强调与引用 ── */
.callout{border-radius:var(--r-card);padding:var(--sp-4);margin-bottom:var(--sp-4)}
.callout-body{font-size:var(--fs-body);line-height:1.65}
.callout-label{font-size:var(--fs-tag);border-radius:999px;padding:.1875rem .625rem;margin-bottom:var(--sp-1)}
.quote{font-size:1.375rem;line-height:1.5;padding:var(--sp-5) var(--sp-4);border-radius:var(--r-card);margin-bottom:var(--sp-4)}
.quote-reveal{border-radius:var(--r-card);margin-bottom:var(--sp-4)}
.qr-title{font-size:var(--fs-cardtitle)}
.qr-btn{font-size:var(--fs-note);border-radius:999px;padding:.5rem 1rem}
.attach-note{border-radius:var(--r-ctl);font-size:var(--fs-note);padding:var(--sp-2) var(--sp-3);margin-bottom:var(--sp-3)}
.divider{margin:var(--sp-5) 0}

/* ── 数据 ── */
.stat-grid{gap:var(--sp-3);margin-bottom:var(--sp-4)}
.stat-card{border-radius:var(--r-card);padding:var(--sp-4) var(--sp-3);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur) var(--ease),border-color var(--dur) var(--ease)}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.stat-num{font-size:2.25rem}
.stat-label{font-size:var(--fs-note)}
.stat-note{font-size:var(--fs-tag)}
.total,.tt{border-radius:var(--r-card)}

/* ── 表格、流程、对照、报站 ── */
.rt,.rs,.cmp-card{border-radius:var(--r-card);margin-bottom:var(--sp-4)}
.rt td:empty{padding-inline:0}          /* 表头少于 5 列时，空单元格收成零宽，不留残列 */
.rt table th,.rt table td{font-size:var(--fs-note);padding:10px 12px}
.rt table th{font-weight:800;letter-spacing:.02em}
.rt-cap b{font-size:var(--fs-text)}
.rs-head b{font-size:var(--fs-text)}
.rs-t{font-size:var(--fs-note)}
.rs-n{font-size:var(--fs-note);line-height:1.5}
.cmp-card{padding:var(--sp-4)}
.cmp-head h4{font-size:var(--fs-text)}
.cmp-side{border-radius:var(--r-ctl)}
.cmp-side p{font-size:var(--fs-note);line-height:1.65}
.metro-list li{font-size:var(--fs-note);line-height:1.6}
.metro-list li.ml-note{font-size:var(--fs-note);border-radius:var(--r-ctl)}
.metro-panel-title b{font-size:var(--fs-text)}
.tabset{border-radius:var(--r-card);padding:var(--sp-3);margin-bottom:var(--sp-4)}
.tab-head{font-size:var(--fs-note);border-radius:999px;padding:.5rem .875rem;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.tab-panel>.grid-1 .card{padding:var(--sp-5) var(--sp-5);border-radius:var(--r-card)}
.tab-panel>.grid{min-height:8rem}       /* 标签间高度稳定，但不再撑出大片空白 */
.tab-panel>.grid-1 .card-title{font-size:var(--fs-cardtitle)}
.step-title{font-size:var(--fs-text)}
.step-body{font-size:var(--fs-note);line-height:1.65}

/* ── 话术与仿真 ── */
.faq,.sl-group{border-radius:var(--r-ctl);margin-bottom:0}
.sl-group summary{font-size:var(--fs-note)}
.faq summary{font-size:var(--fs-cardtitle);font-weight:500;line-height:1.55;padding:1rem 1.125rem;gap:.75rem;align-items:flex-start}
.faq summary::before{inline-size:1.5rem;block-size:1.5rem;font-size:1rem;font-weight:500;line-height:1;margin-block-start:calc((1.55em - 1.5rem)/2)}
.faq-q{min-inline-size:0;overflow-wrap:anywhere}
.faq-inner{padding:0 1.125rem 1.125rem 3.375rem}
.faq-principle{font-size:var(--fs-note);border-radius:var(--r-ctl);padding:var(--sp-2) var(--sp-3)}
.faq-answer{font-size:var(--fs-text);line-height:1.7;border-radius:var(--r-ctl);padding:var(--sp-3) 3rem var(--sp-3) var(--sp-3)}
.sl-line{font-size:var(--fs-text);border-radius:var(--r-ctl)}
.sl-h{font-size:var(--fs-note)}
.sl-p{font-size:var(--fs-note);line-height:1.7}
.copy-wrap{border-radius:var(--r-ctl);padding:var(--sp-3) 2.75rem var(--sp-3) var(--sp-3)}
.copy-wrap .copy-text{font-size:var(--fs-text);line-height:1.7}
.bubble{font-size:var(--fs-text);line-height:1.6;border-radius:var(--r-card)}
.chat-cap{font-size:var(--fs-note);margin-bottom:var(--sp-3)}
.mm-text{font-size:var(--fs-text);line-height:1.7}
figure figcaption,.gallery-item figcaption{font-size:var(--fs-note)}

/* ── 导航与控制：半透明材质分层，点击区不小于 32px ── */
.layout{padding-bottom:6rem}          /* 文字放大后底栏变高，留白按 rem 一起长，避免压住正文 */
.topbar{background:rgba(255,255,255,.72);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.brand-text{font-size:var(--fs-text)}
.topbar-title{font-size:var(--fs-note)}
.search-box input{width:13rem}
.home-btn,.search-box input,.menu-btn{border-radius:var(--r-ctl);font-size:var(--fs-note)}
.nav-group-title{font-size:.9375rem;border-radius:var(--r-ctl);padding:.5rem .625rem}
.nav-link{font-size:.875rem;border-radius:.5rem;padding:.375rem .625rem .375rem .875rem}

  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease)}

<script>
(function(){
 const ua=navigator.userAgent||'';
 const ipad=/iPad/i.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>0);
 const mobile=ipad||/Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
 const narrow=innerWidth<900;
 if(!mobile&&!narrow)return;
 document.documentElement.classList.add('mobile-blocked');document.body.classList.add('mobile-blocked');
 if(document.querySelector('.mobile-block'))return;
 const screen=document.createElement('div');screen.className='mobile-block';screen.setAttribute('role','alertdialog');screen.setAttribute('aria-modal','true');
 const card=document.createElement('div');card.className='mb-card';
 const heading=document.createElement('h2');heading.textContent=mobile?'请使用电脑打开':'请扩大电脑浏览器窗口';
 const p=document.createElement('p');p.textContent=mobile?'本资料仅支持电脑端。手机和平板不开放正文与交互。':'请使用至少 900px 宽的电脑浏览器窗口查看。';
 card.append(heading,p);screen.append(card);document.body.append(screen);
})();

// 翻页导航：一次显示一个小节卡片
(function(){
  const secs=[...document.querySelectorAll('.section[id]')];
  const links=[...document.querySelectorAll('.nav-link')];
  if(!secs.length)return;
  let cur=0;
  const prev=document.getElementById('pager-prev');
  const next=document.getElementById('pager-next');
  const pos=document.getElementById('pager-pos');
  const title=document.getElementById('pager-title');
  function show(i,initial){
    cur=Math.max(0,Math.min(secs.length-1,i));
    secs.forEach((s,k)=>s.classList.toggle('active',k===cur));
    const id=secs[cur].id;
    links.forEach(a=>{const on=a.getAttribute('href')==='#'+id;
      a.classList.toggle('target-current',on);
      if(on){a.setAttribute('aria-current','true');const g=a.closest('.nav-group');
        if(g){g.open=true;document.querySelectorAll('.sidebar details.nav-group').forEach(d=>{if(d!==g)d.open=false;});}
        // 目录自动跟随：把当前项滚进侧栏可视区
        const side=a.closest('.sidebar');
        if(side){const ar=a.getBoundingClientRect(),sr=side.getBoundingClientRect();
          if(ar.top<sr.top+40||ar.bottom>sr.bottom-20){side.scrollTo({top:side.scrollTop+(ar.top-sr.top)-100,behavior:'smooth'});}}
      }
      else a.removeAttribute('aria-current');});
    if(pos)pos.innerHTML='第 <b>'+(cur+1)+'</b> / '+secs.length+' 节';
    if(title)title.textContent=secs[cur].querySelector('h2')?.textContent||'';
    if(prev)prev.disabled=cur===0;
    if(next)next.disabled=cur===secs.length-1;
    if(!initial){
      document.body.classList.add('viewing');
      secs[cur].scrollIntoView({block:'start'}); // 定位到当前小节顶部
    } else {
      window.scrollTo({top:0,behavior:'instant'});
    }
    try{history.replaceState(null,'','#'+id);}catch(e){}
    try{window.dispatchEvent(new CustomEvent('hb:sectionchange',{detail:{index:cur,id:id}}));}catch(e){}
  }
  window.__showSection=show;
  // 封面「开始阅读」：进入正文第一小节
  const startBtn=document.getElementById('cover-start');
  if(startBtn)startBtn.addEventListener('click',()=>{
    document.body.classList.add('viewing');
    show(0);
    try{history.replaceState(null,'',location.pathname);}catch(e){}
  });
  // 顶栏「封面」：回到开场封面
  const homeBtn=document.getElementById('home-btn');
  if(homeBtn)homeBtn.addEventListener('click',()=>{
    document.body.classList.remove('viewing');
    links.forEach(a=>{a.classList.remove('target-current');a.removeAttribute('aria-current');});
    try{history.replaceState(null,'',location.pathname);}catch(e){}
    window.scrollTo({top:0,behavior:'instant'});
  });
  links.forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault();
    const i=secs.findIndex(s=>s.id===a.getAttribute('href').slice(1));
    if(i>=0)show(i);closeMenu();
  }));
  if(prev)prev.addEventListener('click',()=>show(cur-1));
  if(next)next.addEventListener('click',()=>show(cur+1));
  // 键盘左右翻页（输入框 / 弹窗 / tab / 报站控件内不触发）
  document.addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
    const lb=document.getElementById('lightbox');
    if(lb&&lb.open)return; // 弹窗打开时方向键用于切图，不翻小节
    // tab / metro 等自带方向键的控件抢占焦点时不翻页
    if(document.activeElement.closest('[role="tab"],[role="tablist"],.tabset,.metro-stop,.metro,.multi-gallery,.china-map-component'))return;
    if(e.key==='ArrowLeft')show(cur-1);
    if(e.key==='ArrowRight')show(cur+1);
  });
  // 交叉引用：点相关章节 chip 跳到对应小节
  document.addEventListener('click',e=>{
    const chip=e.target.closest('.xref-chip');
    if(!chip)return;
    const i=secs.findIndex(s=>s.id===chip.getAttribute('data-goto'));
    if(i>=0){show(i);window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>secs[i].scrollIntoView({block:'start'}),60);}
  });
  // 深链接：带 hash 直接进正文；否则停在封面
  const h=decodeURIComponent(location.hash.slice(1));
  const start=secs.findIndex(s=>s.id===h);
  if(start>=0){show(start,true);document.body.classList.add('viewing');}
  else show(0,true);
  window.addEventListener('hashchange',()=>{const id=decodeURIComponent(location.hash.slice(1));const i=secs.findIndex(s=>s.id===id);if(i>=0){show(i,true);document.body.classList.add('viewing');}});
})();
// 移动菜单
function closeMenu(){document.querySelector('.sidebar')?.classList.remove('open');}
document.querySelector('.menu-btn')?.addEventListener('click',()=>document.querySelector('.sidebar')?.classList.toggle('open'));
// 图片点击放大（lightbox）
(function(){
  const box=document.getElementById('lightbox');
  if(!box)return;
  const im=box.querySelector('img');
  const cap=box.querySelector('.lightbox-cap');
  const close=box.querySelector('.lightbox-close');
  // 同一组图片（同一 gallery / 图组）内左右切换
  let group=[],gi=0;
  const prevBtn=box.querySelector('.lb-prev'),nextBtn=box.querySelector('.lb-next');
  function paint(){
    if(!group.length)return;
    const el=group[gi];im.src=el.src;im.alt=el.alt||'';
    cap.textContent=el.closest('figure')?.querySelector('figcaption')?.textContent||el.alt||'';
    const multi=group.length>1;
    if(prevBtn)prevBtn.hidden=!multi;
    if(nextBtn)nextBtn.hidden=!multi;
  }
  function step(d){if(group.length<2)return;gi=(gi+d+group.length)%group.length;paint();}
  document.addEventListener('click',e=>{
    const t=e.target.closest('img.zoomable, img.avatar, .gallery-item img');
    if(!t)return;
    if(t.classList.contains('avatar'))return; // 头像是装饰，不放大
    openAt(t);
  });
  function openAt(t){
    // 收集同组图片：优先同 figure 的兄弟，其次同 gallery / 同 section 的所有可放大图
    const scope=t.closest('.gallery')||t.closest('.section')||document;
    group=[...scope.querySelectorAll('img.zoomable, .gallery-item img')].filter(x=>!x.classList.contains('avatar'));
    if(!group.includes(t))group=[t];
    gi=Math.max(0,group.indexOf(t));
    paint();box.showModal();
  }
  // 键盘：图片可聚焦，回车 / 空格打开放大
  document.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const t=e.target.closest('img.zoomable, .gallery-item img');
    if(!t)return;
    e.preventDefault();openAt(t);
  });
  if(prevBtn)prevBtn.addEventListener('click',e=>{e.stopPropagation();step(-1);});
  if(nextBtn)nextBtn.addEventListener('click',e=>{e.stopPropagation();step(1);});
  // 关闭：优先原生 closedby="any"（背景点击 / Esc / 返回手势），仅在不支持时补兜底
  close.addEventListener('click',()=>box.close());
  if(!('closedBy' in HTMLDialogElement.prototype)){
    // 回退：指针按下与抬起都在对话框外才关闭（避免文字选中拖拽误关）
    const outside=(e)=>{const r=box.getBoundingClientRect();
      return e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom;};
    let pressedOutside=false;
    box.addEventListener('pointerdown',e=>{pressedOutside=outside(e);});
    box.addEventListener('pointerup',e=>{if(pressedOutside&&outside(e))box.close();pressedOutside=false;});
  }
  // 左右键翻图；Esc 由原生模态处理，不重复拦截
  box.addEventListener('keydown',e=>{

(function(){

    if(el.dataset.done==='1')return;

    const decimals=(raw.split('.')[1]||'').length;
    const dur=parseInt(el.getAttribute('data-dur')||'1100',10);
    const vEl=el.querySelector('.stat-v');
    if(!vEl)return;

    function tick(now){
      const p=Math.min(1,(now-t0)/dur);
      const eased=1-Math.pow(1-p,3); // easeOutCubic
      vEl.textContent=fmt(target*eased,decimals);
      if(p<1)requestAnimationFrame(tick);
      else vEl.textContent=fmt(target,decimals);
    }
    requestAnimationFrame(tick);
  }
  function runIn(section){
    if(!section)return;
    section.querySelectorAll('[data-count]').forEach(el=>{

  const first=document.querySelector('.section.active');
  if(first)runIn(first);

    const list=[...document.querySelectorAll('.section[id]')];
    runIn(list[e.detail.index]);
  });
})();

 frame.addEventListener('keydown',e=>{let handled=true;if(e.key==='+'||e.key==='=')zoomAt(1.4);else if(e.key==='-')zoomAt(1/1.4);else if(e.key==='Home'){scale=1;x=0;y=0;paint();}else if(e.key.startsWith('Arrow')){const step=35/scale;if(e.key==='ArrowLeft')x-=step;else if(e.key==='ArrowRight')x+=step;else if(e.key==='ArrowUp')y-=step;else if(e.key==='ArrowDown')y+=step;paint();}else handled=false;if(handled){e.preventDefault();e.stopPropagation();}});new ResizeObserver(paint).observe(frame);document.fonts.ready.then(paint);paint();
});})();
</script>
